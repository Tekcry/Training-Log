function openImport(){
  /* Reading the clipboard directly means no text box to tap and no keyboard. The
     box is still there for when the browser will not hand the clipboard over, but
     it stays hidden until it is needed. */
  const canClip = !!(navigator.clipboard && navigator.clipboard.readText);
  let h='<div class="veil" id="veil"></div><div class="sheet"><h3>Import</h3>'+
    '<div class="muted" style="margin-top:6px">Replaces everything currently saved.</div>'+
    '<input type="file" id="imFile" style="display:none">'+
    '<textarea id="imText" placeholder="Paste a backup here" '+
      'style="min-height:110px;margin-top:14px'+(canClip?';display:none':'')+'"></textarea>'+
    '<div class="duo">'+
      '<button class="btn" id="imPaste">[ '+(canClip?'PASTE':'RESTORE')+' ]</button>'+
      '<button class="btn ghost" id="imBtn">[ FROM FILE ]</button>'+
    '</div>'+
    (canClip?'<button class="btn ghost" id="imType">Type it in instead</button>':'')+
    '<button class="btn ghost" id="imBack">Back</button></div>';
  setSheet(h);
  document.getElementById('veil').onclick=closeSheet;
  document.getElementById('imBack').onclick=openBackup;
  const file=document.getElementById('imFile'), box=document.getElementById('imText');
  document.getElementById('imBtn').onclick=()=>file.click();
  file.onchange=()=>{
    const f=file.files&&file.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>doImport(r.result);
    r.onerror=()=>toast('Could not read file');
    r.readAsText(f);
  };
  const reveal=()=>{
    box.style.display='block';
    const t=document.getElementById('imType'); if(t) t.remove();
    document.getElementById('imPaste').textContent='[ RESTORE ]';
    document.getElementById('imPaste').onclick=()=>doImport(box.value);
  };
  const t=document.getElementById('imType');
  if(t) t.onclick=()=>{ reveal(); box.focus(); };
  document.getElementById('imPaste').onclick=()=>{
    if(box.style.display!=='none' || !canClip) return doImport(box.value);
    navigator.clipboard.readText().then(txt=>{
      if(txt && txt.trim()) doImport(txt);
      else { toast('CLIPBOARD EMPTY'); reveal(); }
    }).catch(()=>{ toast('CLIPBOARD BLOCKED'); reveal(); });
  };
}
/* Repainting the whole page on every set is what made the screen jump: the browser
   dropped its scroll position mid-animation. Only the tapped row actually changes,
   so patch that one row and leave the rest of the DOM alone. */
function paintSet(id,ix){
  const e=EX[id], d=draft[id][ix], b=document.getElementById('sb-'+id+'-'+ix);
  if(!b||!d) return;
  const sd=b.querySelector('.sd'), sc=b.querySelector('.sc');
  if(sd) sd.innerHTML = d.tk
    ? (e.bw ? (d.v&&d.v!=='Bodyweight' ? esc(d.v)+' \u00b7 ' : '')+d.reps+' reps'
            : kgTxt(+d.kg)+'kg \u00d7 '+d.reps)
    : (d.pending ? 'IN PROGRESS' : '');
  if(sc) sc.textContent = d.tk ? '\u2713' : '';
  const rb=b.querySelector('.rb');
  if(rb) rb.classList.toggle('hide', !(d.tk && isRecord(id,ix)));
  b.classList.toggle('on', !!d.tk);
  b.classList.toggle('arming', !!d.pending && !d.tk);
}
function paintPending(id,ix,on){
  const b=document.getElementById('sb-'+id+'-'+ix); if(!b) return;
  b.classList.toggle('arming',!!on);
  const sd=b.querySelector('.sd'); if(sd && !draft[id][ix].tk) sd.textContent = on?'IN PROGRESS':'';
}
function dropPending(exId,exIx){
  for(const k in draft) draft[k].forEach((c,i)=>{
    if(c.pending && !c.tk && !(k===exId && i===exIx)){ c.pending=false; paintPending(k,i,false); }
  });
}
function openSet(id,ix){
  sfx('open');
  const e=EX[id], cell=draft[id][ix], def=setDefaults(id,ix);
  // remember the rest that was already running, so backing out can restore it
  const prev={end:T.restEnd, src:T.src, buzzed:T.buzzed};
  const armedNow = !cell.pending && !cell.tk;
  if(armedNow){                         // rest starts the moment the set is over
    dropPending(id,ix);                 // only one set can be mid-flight
    cell.pending=true;
    startRest(id,ix);
    updateStrip();
    paintPending(id,ix,true);
  }
  let field='';
  if(e.bw){
    const vs=e.vars||['Bodyweight'];
    field = vs.length===1
      ? '<div class="fixedv">'+esc(vs[0])+'</div>'
      : '<select id="setV">'+vs.map(v=>'<option value="'+esc(v)+'"'+(def.v===v?' selected':'')+'>'+esc(v)+'</option>').join('')+'</select>';
  } else {
    field = '<select id="setKg">'+ladder(id).map(v=>'<option value="'+v+'"'+(def.kg===v?' selected':'')+'>'+kgTxt(v)+' kg</option>').join('')+'</select>';
  }
  const ro=repOpts(e).map(r=>'<option value="'+r+'"'+(def.reps===r?' selected':'')+'>'+r+'</option>').join('');

  setSheet(
    '<div class="veil" id="veil"></div><div class="sheet"><h3>'+esc(e.n)+' \u00b7 SET '+(ix+1)+'</h3>'+
    '<div class="setgrid">'+
      '<div class="sel'+(e.bw&&(e.vars||[]).length<2?' plain':'')+'">'+field+'</div>'+
      '<div class="sel narrow"><select id="setR">'+ro+'</select><span class="ru">reps</span></div>'+
    '</div>'+
    '<button class="btn" id="setOk">[ CONFIRM ]</button>'+
    '<button class="btn ghost" id="setCancel">Back</button></div>');

  const close=()=>{
    if(armedNow && !cell.tk){           // nothing was logged, so undo the arming
      cell.pending=false;
      paintPending(id,ix,false);
      T.restEnd=prev.end; T.src=prev.src; T.buzzed=prev.buzzed;
      updateStrip();
    }
    closeSheet(); updateNext(false); paintFab();
  };
  document.getElementById('veil').onclick=close;
  document.getElementById('setCancel').onclick=close;
  document.getElementById('setOk').onclick=()=>{
    const was=xpLive(), lw=levelOf(was.base+was.live);   // score before this set lands
    const k=document.getElementById('setKg'), v=document.getElementById('setV'), r=document.getElementById('setR');
    cell.kg = k ? k.value : 0;
    if(e.bw) cell.v = v ? v.value : (e.vars||['Bodyweight'])[0];
    cell.reps = r.value;
    cell.tk=true; cell.pending=false;
    /* Measure the row before the re-render throws it away. */
    const hit=document.getElementById('sb-'+id+'-'+ix);
    const at=hit?hit.getBoundingClientRect():null;
    closeSheet(); paintSet(id,ix); updateNext(true); paintFab();
    const now=xpLive(), ln=levelOf(now.base+now.live);
    const gain=(now.base+now.live)-(was.base+was.live);
    xpPop(at,gain);
    sfx(isRecord(id,ix)?'record':'confirm');
    if(ln.lvl>lw.lvl) setTimeout(()=>{ lvlPop(ln); sfx('level'); },420);
  };
}
function askConfirm(title,body,yes){
  return new Promise(res=>{
    const stack=!!topSheet();
    setSheet(
      '<div class="veil" id="veil"></div><div class="sheet"><h3>'+title+'</h3>'+
      '<div class="muted" style="margin-top:6px">'+body+'</div>'+
      '<button class="btn" id="cfYes">'+yes+'</button>'+
      '<button class="btn ghost" id="cfNo">Cancel</button></div>', stack);
    const box=stack?topSheet().parentNode:document;
    const end=v=>{ stack?popSheet():closeSheet(); res(v); };
    const veils=document.querySelectorAll('#sheetWrap .veil');
    veils[veils.length-1].onclick=()=>end(false);
    box.querySelector('#cfNo').onclick=()=>end(false);
    box.querySelector('#cfYes').onclick=()=>end(true);
  });
}
async function doImport(txt){
  const raw=(txt||'').trim();
  let d;
  if(/^TL1\b/.test(raw)) d=unpackDB(raw);
  else { try{ d=JSON.parse(raw); }catch(e){ toast('Not a valid backup'); return; } }
  if(!d || !Array.isArray(d.sess)){ toast('Not a valid backup'); return; }
  const ok=await askConfirm('Import '+d.sess.length+' session'+(d.sess.length===1?'':'s')+'?',
    'This replaces the '+DB.sess.length+' session'+(DB.sess.length===1?'':'s')+' and '+DB.wt.length+' weight entr'+(DB.wt.length===1?'y':'ies')+' currently saved. It cannot be undone.',
    'Replace with '+d.sess.length);
  if(!ok){ openBackup(); return; }
  DB=cleanDB(d);
  save(); closeSheet(); draft={}; pick=null; resetTimer(); go();
  toast('Imported '+d.sess.length+' sessions');
}
/* Export as a .txt. On iOS the native route is the share sheet — that gives
   Save to Files, Notes, Mail and AirDrop. Falls back to a download, then to copy. */
function backupName(){
  const d=new Date();
  const p=n=>String(n).padStart(2,'0');
  return 'training-'+String(d.getFullYear()).slice(2)+p(d.getMonth()+1)+p(d.getDate())+'.txt';
}
let EXPORTING=false;
async function exportFile(){
  if(EXPORTING) return true;        // a second tap must not write a second file
  EXPORTING=true;
  try{ return await runExport(); }
  finally{ setTimeout(()=>{ EXPORTING=false; },600); }
}
async function runExport(){
  const text=packDB(), name=backupName();
  /* Share first where it exists. Once the sheet has been handed the file, this
     function is done either way — it must never fall through to the download link
     as well, or the backup is written twice. */
  if(navigator.share && window.isSecureContext){
    let file=null;
    try{ file=new File([text], name, {type:'text/plain'}); }catch(e){}
    if(file && (!navigator.canShare || navigator.canShare({files:[file]}))){
      try{
        await navigator.share({files:[file], title:name});
        markBacked(); toast('EXPORTED');
      }catch(e){
        if(!e || e.name!=='AbortError') toast('SHARE FAILED');
      }
      return true;                  // handed over, whatever the outcome
    }
  }
  try{
    const b=new Blob([text],{type:'text/plain'}), u=URL.createObjectURL(b);
    const a=document.createElement('a'); a.href=u; a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(u); a.remove();},400);
    markBacked(); toast('SAVED '+name);
    return true;
  }catch(e){}
  const t=document.getElementById('exText');
  if(t && copyBox(t)){ toast('COPIED'); return true; }
  toast('SELECT AND COPY');
  return false;
}

/* How long this has been going on, counted from the first session in the log. */
function sinceStart(){
  if(!DB.sess.length) return 'DAY ONE';
  const days=daysAgo(DB.sess[0].d)+1;
  if(days<7) return 'DAY '+days;
  const wk=Math.floor(days/7)+1;
  return 'WEEK '+wk+' \u00b7 DAY '+days;
}
function splash(){
  const el=document.getElementById('splash');
  if(!el){ document.documentElement.classList.remove('booting'); return; }   // never leave it hidden
  const line=document.getElementById('spLine'), go=document.getElementById('spGo');
  const days=document.getElementById('spDays');
  if(days) days.textContent=sinceStart();
  if(line) line.textContent=LINES[Math.floor(Math.random()*LINES.length)];
  if(go) go.textContent='[ INITIALISE ]';
  /* Let the line sit on its own first — the button arriving too early turns it
     into a dialog to dismiss rather than something to read. */
  setTimeout(()=>{ if(go) go.classList.add('on'); },2600);
  const drop=()=>{
    if(!go || !go.classList.contains('on') || go.classList.contains('out')) return;
    sfx('start');                       // also unlocks audio for the session
    go.classList.add('out');            // the button cuts out first
    setTimeout(()=>{
      el.classList.add('out');          // then the screen
      document.documentElement.classList.remove('booting');   // interface behind it
    },190);
    setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); },650);
  };
  if(go) go.addEventListener('click',drop);
}

/* ---------- the rolling static ----------
   Each pass gets its own height, brightness, speed and travel, and the gap before
   the next one is random too, so it never settles into a rhythm. Roughly one pass
   in six stutters partway down; roughly one in twelve drifts upward instead. */
const RND=(a,b)=>a+Math.random()*(b-a);
/* A thin line of interference crossing the screen at a fixed rate, with a random
   pause before the next one so the cycle never reads as a metronome. It buzzes once
   per crossing, at a random point along the way, and never at any other time. */
const ROLLSEC=6.8;      // a slow drift down the glass
let BUZZT=0, BUZZING=false, ROLLBUZZ=0;
function buzz(el){
  if(BUZZING) return;                 // one flurry at a time, never overlapping
  BUZZING=true;
  /* At rest it is barely there. The buzz is the moment it bites: the static jumps,
     the torn lines come up, and the blur on whatever is behind it trebles. */
  const hit=()=>{
    el.style.setProperty('--sk',RND(-3.4,3.4).toFixed(2)+'deg');
    el.style.setProperty('--tx',Math.round(RND(-18,18))+'px');
    el.style.setProperty('--go',RND(.42,.66).toFixed(3));
    el.style.setProperty('--ln','1');
    el.style.setProperty('--bf',RND(1.8,3).toFixed(2)+'px');
    el.style.setProperty('--bc','1.2'); el.style.setProperty('--bb','1.1');
    el.style.opacity=RND(0.85,1.15).toFixed(2);
  };
  const rest=()=>{
    el.style.setProperty('--sk','0deg');
    el.style.setProperty('--tx','0px');
    el.style.setProperty('--go','.1');
    el.style.setProperty('--ln','.5');
    el.style.setProperty('--bf','.55px');
    el.style.setProperty('--bc','1.05'); el.style.setProperty('--bb','1.02');
    el.style.opacity=RND(0.4,0.62).toFixed(2);
    BUZZING=false; BUZZT=0;
  };
  let n=0; const shots=Math.round(RND(3,7));
  (function again(){
    hit(); n++;
    BUZZT = n<shots ? setTimeout(again,RND(28,70)) : setTimeout(rest,RND(40,90));
  })();
}
function rollPass(){
  const el=document.querySelector('.roll');
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!el || reduce) return;
  if(document.hidden) return setTimeout(rollPass,600);
  const vh=(window.visualViewport&&window.visualViewport.height)||window.innerHeight;
  const h=Math.round(RND(14,34));          // a line, never a band
  el.style.height=h+'px';
  el.style.opacity=RND(0.4,0.62).toFixed(2);
  const from=-h-10, to=vh+10;
  const rate=(vh+40)/ROLLSEC;              // fixed pixels per second
  const dur=Math.round((to-from)/rate*1000);
  let a;
  try{
    a=el.animate([{transform:'translate3d(0,'+from+'px,0)'},
                  {transform:'translate3d(0,'+to+'px,0)'}],
                 {duration:dur,easing:'linear'});
  }catch(e){ el.style.opacity=0; return setTimeout(rollPass,2000); }
  clearTimeout(ROLLBUZZ);
  ROLLBUZZ=setTimeout(()=>buzz(el), dur*RND(0.15,0.8));   // one buzz per crossing
  a.onfinish=()=>{
    clearTimeout(ROLLBUZZ);            // nothing buzzes between crossings
    el.style.opacity=0;
    /* Long, uneven gaps: the line is an occasional event, not a fixture. */
    setTimeout(rollPass, RND(6000,38000));
  };
}
/* Poor signal, drawn frame by frame. Each row takes its own base brightness before
   the per-pixel noise goes on top — that horizontal correlation is what separates
   television static from a field of random dots — and rows occasionally tear into a
   bright or black run. Redrawn about 24 times a second, and only while a line is
   actually on screen. */
let NCTX=null, NIMG=null, NLAST=0, NOCANVAS=false;
function drawStatic(){
  if(NOCANVAS) return;                       // asked once, refused; stop asking
  const el=document.querySelector('.roll');
  const cv=document.getElementById('rollCv');
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!cv || !el || reduce) return;
  requestAnimationFrame(drawStatic);
  const now=Date.now();
  if(now-NLAST < 42) return;                 // ~24 frames a second is plenty
  NLAST=now;
  if(document.hidden || +el.style.opacity===0) return;
  if(!NCTX){
    NCTX=cv.getContext && cv.getContext('2d');
    if(!NCTX){ cv.style.display='none'; NOCANVAS=true; return; }   // no canvas: drop the layer, keep the line
    NIMG=NCTX.createImageData(cv.width,cv.height);
  }
  paintNoise(NCTX,NIMG,cv.width,cv.height,BUZZING);
}
/* One frame of static. Each row takes its own base level before the per-pixel noise
   goes on, and rows sometimes tear into a blown-out or crushed run — that is what
   separates signal noise from a field of dots. */
function paintNoise(ctx,img,w,h,hot){
  const d=img.data;
  for(let y=0;y<h;y++){
    let base=RND(hot?40:20, hot?150:95);
    const tear=Math.random() < (hot?0.22:0.07);
    const tearAt=tear?Math.floor(RND(0,w)):-1;
    const tearLen=tear?Math.floor(RND(6,w*0.6)):0;
    const bright=Math.random()<0.6;
    for(let x=0;x<w;x++){
      let v=base+RND(-55,55);
      if(tear && x>=tearAt && x<tearAt+tearLen) v = bright? v+RND(60,130) : v*0.25;
      if(v<0) v=0; if(v>255) v=255;
      const i=(y*w+x)*4;
      d[i]=v; d[i+1]=v*1.03>255?255:v*1.03; d[i+2]=v*0.94;   // a touch of green
      d[i+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
}
/* ---------- the whole screen goes, once in a while ----------
   Not a layer over the top: the interface itself is pulled apart for a moment.
   Skipped while a sheet is open, so it never lands mid-entry. */
let FUZZING=false;
function screenFuzz(){
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce || document.hidden || document.querySelector('.sheet')) return fuzzNext();
  const root=document.documentElement;
  FUZZING=true;
  const dur=Math.round(RND(380,560));
  root.style.setProperty('--gdur',dur+'ms');
  root.classList.add('glitching');
  const st=document.createElement('div');
  st.className='uistatic';
  document.body.appendChild(st);
  setTimeout(()=>{
    root.classList.remove('glitching');
    root.style.removeProperty('--gdur');
    if(st.parentNode) st.parentNode.removeChild(st);
    FUZZING=false;
    fuzzNext();
  }, dur+40);
}
function fuzzNext(){ setTimeout(screenFuzz, RND(16000,55000)); }
/* One briefing open at a time. The trick to it not jerking: shut the others with no
   animation first, measure how far the tapped one moved as a result, and correct the
   scroll by that exact amount before the new one starts opening. */
function openBrief(id){
  const brief=document.querySelector('.bsum[data-br="'+id+'"]').parentNode;
  const body=document.getElementById('br-'+id);
  if(!brief||!body) return;
  const wasOpen=brief.classList.contains('open');
  const mark=brief.getBoundingClientRect().top;
  document.querySelectorAll('.brief.open').forEach(o=>{
    if(o===brief) return;
    const b=o.querySelector('.bbody');
    b.classList.remove('anim'); b.style.height='0px';       // instant, no animation
    o.classList.remove('open');
  });
  /* anything above us just collapsed, so the page has shifted under our finger */
  const moved=brief.getBoundingClientRect().top-mark;
  if(Math.abs(moved)>1) window.scrollTo(0,Math.max(0,window.pageYOffset+moved));
  if(wasOpen){
    body.classList.add('anim');
    body.style.height=body.scrollHeight+'px';
    requestAnimationFrame(()=>{ body.style.height='0px'; });
    brief.classList.remove('open');
    return;
  }
  brief.classList.add('open');
  body.classList.add('anim');
  body.style.height='0px';
  requestAnimationFrame(()=>{ body.style.height=body.scrollHeight+'px'; });
  const done=e=>{
    if(e.propertyName!=='height') return;
    body.removeEventListener('transitionend',done);
    if(brief.classList.contains('open')) body.style.height='auto';   // let it reflow freely
  };
  body.addEventListener('transitionend',done);
}
document.addEventListener('click',e=>{
  const b=e.target && e.target.closest && e.target.closest('.bsum');
  if(b) openBrief(b.dataset.br);
},false);

/* Interference on the live row: random gaps, only while a session is running and
   nothing is covering the screen. */
let ZAPT=0;
function zapLoop(){
  clearTimeout(ZAPT);
  ZAPT=setTimeout(()=>{
    const row=document.querySelector('.setbtn.now');
    const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(row && T.start && !reduce && !document.querySelector('.sheet') && !document.hidden){
      row.classList.remove('zap'); void row.offsetWidth; row.classList.add('zap');
      setTimeout(()=>{ row.classList.remove('zap'); },430);
    }
    zapLoop();
  }, 4500+Math.random()*7000);
}

/* The interface is hidden until the splash is dismissed, so anything that throws on
   the way up would leave a blank screen. Each step is isolated, and a watchdog
   uncovers the app regardless after a few seconds. */
const boot=(name,fn)=>{ try{ fn(); }catch(e){ console.error('start-up: '+name, e); } };
setTimeout(()=>{
  const r=document.documentElement;
  if(r.classList.contains('booting')){
    r.classList.remove('booting');                 // never stay blank
    const sp=document.getElementById('splash');
    if(sp && !document.getElementById('spGo')) sp.remove();
  }
},7000);
boot('load',load);
boot('render',go);
boot('sheets',watchSheets);
boot('splash',splash);
boot('music',mPreselect);
boot('interference',()=>{ zapLoop(); setTimeout(rollPass, RND(1500,9000)); drawStatic(); fuzzNext(); });
boot('worker',()=>{ if(HOSTED && 'serviceWorker' in navigator)
  navigator.serviceWorker.register('sw.js').catch(()=>{}); });
boot('tick',runTick);
boot('cog',refreshCog);
boot('restore',()=>{
  if(!DB.seen && !DB.sess.length && !DB.wt.length) setTimeout(openRestore,500);
  else if(STORE==='memory') setTimeout(()=>toast('Not saving \u2014 export before closing'),600);
});
</script>
</body>
</html>
