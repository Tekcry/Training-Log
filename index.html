    for(let i=0;i<3;i++){
      const rem=await ghGet(), local=logOf(DB);
      if(!rem.log && !local.sess.length) break;
      const merged=mergeLog(local,rem.log||EMPTY), mj=JSON.stringify(merged);
      if(mj!==canon(local)) applyLog(merged);
      /* Written unless the file already says exactly this, so anything it holds that
         the log no longer keeps is cleared from it too. */

      const r=await ghPut(merged,rem.sha);
      if(r.status===409 || r.status===422) continue;         // moved under us: read again
      if(!r.ok) throw r.status;

/* Feedback notes: text of any length, when added (t) and last changed (e). A deleted note is

async function ghConnect(){

  const tok=document.getElementById('syTok').value.trim();

  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)) return fail('REPO SHOULD LOOK LIKE OWNER/NAME');
  if(!/^(gh[pousr]_|github_pat_)\w+/.test(tok)) return fail('NOT A GITHUB TOKEN');

/* Backup format TL1 — plain text, one line per session.
   260824 A gsq 20x10,20x10,20x12 | bp 10x8,10x8
   Weighted sets are kg x reps; bodyweight sets are variant-index x reps. */
const d6=v=>v.slice(2,4)+v.slice(5,7)+v.slice(8,10);
const d10=v=>'20'+v.slice(0,2)+'-'+v.slice(2,4)+'-'+v.slice(4,6);
function packDB(){
  const out=['TL1'];
  DB.sess.forEach(x=>{
    const parts=Object.keys(x.sets).map(id=>{
      const e=EX[id]; if(!e) return '';
      const vs=e.vars||[];
      return id+' '+x.sets[id].map(r=> e.bw
        ? Math.max(0,vs.indexOf(r.v))+'x'+r.reps
        : kgTxt(r.kg)+'x'+r.reps).join(',');
    }).filter(Boolean);
    out.push(parts.length ? d6(x.d)+' '+x.w+' '+parts.join(' | ')

function unpackDB(txt){
  const out={sess:[]};

    line=line.trim();
    if(!line || line==='TL1') return;
    if(/^[A-Z] /.test(line)) return;   // W, M, P and Y lines from older versions: not kept
    /* A session logged before this app existed: date, workout letter (or a dash if
       it is not known), and nothing after it. It happened; there is just no detail. */
    const bare=line.match(/^(\d{6})\s+([AB-])$/);
    if(bare){ out.sess.push({d:d10(bare[1]), w:bare[2], sets:{}}); return; }
    const m=line.match(/^(\d{6})\s+(\S+)\s+(.*)$/); if(!m) return;
    const sets={};
    m[3].split('|').forEach(chunk=>{
      const t=chunk.trim().split(/\s+/), id=t[0];
      if(!EX[id] || !t[1]) return;
      const e=EX[id], vs=e.vars||['Bodyweight'];
      const v=t.slice(1).join('').split(',').filter(Boolean).map(pair=>{
        const q=pair.split('x');
        return e.bw ? {kg:0, reps:+q[1], v:vs[+q[0]]||vs[0]} : {kg:+q[0], reps:+q[1]};

  const out={sess:[],del:{}};

  const E=x=>num(x&&x.e,0,1e13)||0;
  (Array.isArray(d.sess)?d.sess:[]).forEach(x=>{
    if(!x || !DATE_RE.test(x.d)) return;
    const known=!!W[x.w];
    const sets={};
    Object.keys(x.sets||{}).forEach(id=>{
      if(!EX[id] || !Array.isArray(x.sets[id])) return;
      const v=x.sets[id].map(r=>{
        const o={kg:num(r&&r.kg,0,500), reps:num(r&&r.reps,0,999)};
        const vs=EX[id].vars||[];
        if(r && vs.indexOf(r.v)>-1) o.v=r.v;
        return o;
      }).filter(r=>r.kg!==null && r.reps!==null);
      if(v.length) sets[id]=v;

    /* A session with no sets is one that was backfilled from elsewhere — it is kept,
       with a dash where the workout letter would be if we do not know it. A session
       with sets but an unrecognised workout is corrupt, and is dropped. */
    if(!known && Object.keys(sets).length) return;

function panelHitStop(){
  if(HITIV){ clearInterval(HITIV); HITIV=null; }
  if(HITEND){ clearTimeout(HITEND); HITEND=null; }
  const disp=document.getElementById('uiwarpDisp');
  if(disp) disp.setAttribute('scale',0);
  document.querySelectorAll('.uistatic').forEach(x=>{ if(x.parentNode) x.parentNode.removeChild(x); });

const ios=()=>document.documentElement.classList.contains('ios');
function panelHit(sh){
  if(!sh) return;

  if(reduce || document.hidden || ios()) return;
  panelHitStop();
  const dur=Math.round(RND(190,260));
  sh.style.setProperty('--gdur',dur+'ms');
  sh.classList.add('hit');
  const st=document.createElement('div');
  st.className='uistatic';
  /* the wash reads --gdur off itself: it hangs on the body, not on the panel, so the
     panel's copy of the variable never reaches it */
  st.style.setProperty('--gdur',dur+'ms');
  document.body.appendChild(st);
  /* How hard the field pushes, and how coarse it is, frame by frame: a hard tear,
     then a couple of smaller ones, settling to nothing. The vertical frequency is the
     one that matters — it decides how many waves fit down the panel. */
  const F=[[62,'0.006 0.20'],[16,'0.002 0.07'],[48,'0.008 0.26'],[9,'0.001 0.04'],
           [38,'0.005 0.17'],[6,'0.002 0.09'],[24,'0.007 0.22'],[3,'0.001 0.05'],
           [14,'0.004 0.13'],[0,'0.002 0.09']];

  let i=0;
  const step=()=>{
    const f=F[i++];
    if(!f) return;
    if(disp) disp.setAttribute('scale',f[0]);
    if(noise){ noise.setAttribute('baseFrequency',f[1]); noise.setAttribute('seed',Math.floor(RND(1,90))); }
  };
  step();
  HITIV=setInterval(step, Math.max(16, Math.round(dur/F.length)));

    clearInterval(HITIV); HITIV=null;
    if(disp) disp.setAttribute('scale',0);

  syncPad(true);

  const had=!!wrap.querySelector('.veil:not(.out)');
  if(stack && had){
    const depth=wrap.querySelectorAll('.sheet').length;
    const below=topSheet();
    const box=document.createElement('div');
    box.className='layer';
    box.innerHTML=html;
    const v=box.querySelector('.veil'), sh=box.querySelector('.sheet');
    if(v){ v.style.zIndex=65+depth*10; v.classList.add('noanim'); v.removeAttribute('id'); v.classList.add('vstack'); }

    const same = sh && below && sh.classList.contains('full') && below.classList.contains('full');
    if(same && sh) sh.classList.add('cut');

    if(same) panelHit(sh);

    return;
  }

     screen changing what it shows, not a new screen arriving. The outgoing panel is
     backdrop it is standing on is reused, the incoming panel replaces the outgoing one
     outright, and the contents take the hit. Nothing behind it is ever exposed. */

    oldSh.removeAttribute('id');

    if(oldSh.parentNode) oldSh.parentNode.removeChild(oldSh);

    return;
  }
  wrap.innerHTML=html;
  lockScroll();                 // immediately, not a tick later on the observer
  const bv=wrap.querySelector('.veil'), bs=wrap.querySelector('.sheet');
  if(bv && bs && bs.classList.contains('full')) bv.classList.add('panel');
  if(!had) return;

  const sh=wrap.querySelector('.sheet'); if(sh) sh.classList.add('swapin');

const PLAN={total:72,perWeek:3};
const MILES=[
 {n:6, t:'Form settled on both workouts', p:'<b>80%</b> are still going at two weeks. The easy part.'},
 {n:15,t:'Every lift has gone up once',   p:'<b>65%</b> last five weeks. Month one is where most quit.'},
 {n:27,t:'Waist easing, scale flat',      p:'<b>50%</b> still going at month three. The field thins here.'},
 {n:42,t:'Arms thicker, posture holding', p:'<b>40%</b> make fourteen weeks. By then it is habit.'},
 {n:60,t:'Visibly built at 75kg',         p:'<b>33%</b> reach five months. You would be in the top third.'},
 {n:72,t:'Six months done',               p:'<b>30%</b> finish six months. Most who start never see this.'}

function pace(){
  const n=DB.sess.length;
  if(n<6) return PLAN.perWeek;
  // lifetime average alone never forgets a bad month, so blend it with a recent window
  const lifetime = Math.max(0.5, n/Math.max(1, daysAgo(DB.sess[0].d)/7));
  const k = Math.min(8,n), span = daysAgo(DB.sess[n-k].d) - daysAgo(DB.sess[n-1].d);
  let recent = lifetime;
  if(span > 0){
    const gap = span/(k-1), stale = daysAgo(DB.sess[n-1].d);
    // rest days you normally take are not slippage; only the excess counts against you
    recent = (k-1)/((span + Math.max(0, stale-gap))/7);
  }
  return Math.max(1, Math.min(7, 0.5*recent + 0.5*lifetime));
}
function stale(){ return DB.sess.length ? daysAgo(DB.sess[DB.sess.length-1].d) : 0; }
function etaFor(target){
  if(stale() > 21) return 'paused';        // no honest date after a layoff this long
  const left=Math.max(0,target-DB.sess.length);
  const d=new Date(); d.setDate(d.getDate()+Math.round(left/pace()*7));
  return d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'2-digit'});

function nextMile(){ return MILES.find(m=>m.n>DB.sess.length)||null; }

/* ---------- clearance ----------
   XP is never stored. It is recomputed from the session log every time, so it
   survives a TL1 import and can never drift from what was actually trained.

   Nothing scales with raw reps. Grinding set 1 to failure earns the same 10 as a
   paced one, and then costs the HELD bonus and the quality points on sets 2 and 3

const XP={set:10,quality:5,top:8,held:20,record:35,unlock:120,full:60,ontime:25,week:150};
const RANKS=[[0,'RECRUIT'],[5,'OPERATIVE'],[10,'AGENT'],[15,'SPECIALIST'],
             [20,'VETERAN'],[25,'ELITE'],[30,'HOUND'],[35,'GRAY FOX'],
             [40,'FOX'],[45,'FOXHOUND'],[50,'BIG BOSS']];

function xpNeed(l){ return Math.min(1900, 450+80*l); }
function levelOf(xp){
  let l=0, rem=Math.max(0,Math.round(xp));

function weekKey(d){

/* A lift's best ever: the heaviest it has been done, and the most reps at that
   weight. Bodyweight lifts are judged on total reps instead. */
function blankBest(){ return {kg:0,reps:0,tot:0}; }
function setsPeak(id,sets){
  const e=EX[id], done=(sets||[]).filter(x=>x.reps>0);
  if(!done.length) return null;
  const kg=Math.max.apply(null,done.map(x=>+x.kg||0));
  return {kg:kg,
          reps:Math.max.apply(null,done.filter(x=>(+x.kg||0)===kg).map(x=>x.reps)),

function beatsBest(id,peak,best){

function mergeBest(id,best,peak){
  const b=best||blankBest();

  if(EX[id].bw) return {kg:0,reps:0,tot:Math.max(b.tot,peak.tot)};
  if(peak.kg>b.kg) return {kg:peak.kg,reps:peak.reps,tot:0};
  if(peak.kg===b.kg) return {kg:b.kg,reps:Math.max(b.reps,peak.reps),tot:0};
  return b;
}
/* One session's score. Nothing scales with raw reps: pacing pays, grinding set 1

   sessions the week already had. */
function xpForSession(s,prev,gap,weekN,paid){
  /* Backfilled sessions have no sets to score. They still count as sessions — for
     the tally and the week — but they earn nothing and take no grade. */
  if(!s.sets || !Object.keys(s.sets).length)
    return {total:0, lines:[], sets:0, planned:0, grade:'\u2014', score:0,
            recs:0, unlocks:0, week:false, won:[], bare:true};
  let sets=0,qual=0,tops=0,held=0,holdable=0,recs=0,unl=0;
  const won=[];
  for(const id in s.sets){
    const e=EX[id]; if(!e) continue;
    const v=s.sets[id].filter(x=>x.reps>0); if(!v.length) continue;

  if(held) L.push([held+' held across sets', held*XP.held]);
  if(recs) L.push([recs+' new record'+(recs===1?'':'s'), recs*XP.record]);

          grade:grade, score:Math.round(score), recs:recs, unlocks:unl, week:week, won:won};
}
/* The ledger walks every session, so it is computed once and held until the log

let LEDGER=null;
function ledger(){
  /* Recompute when the log is replaced (import) or grows (save), not otherwise. */
  if(!LEDGER || LEDGER.src!==DB.sess || LEDGER.n!==DB.sess.length){
    LEDGER=xpLedger(); LEDGER.src=DB.sess; LEDGER.n=DB.sess.length;
  }
  return LEDGER;
}
function xpLedger(){
  const best={}, weeks={}, paid={}; let total=0; const per=[];
  DB.sess.forEach((s,i)=>{
    const gap = i ? Math.max(0, daysAgo(DB.sess[i-1].d)-daysAgo(s.d)) : null;
    const wk=weekKey(s.d); weeks[wk]=(weeks[wk]||0)+1;
    const r=xpForSession(s,best,gap,weeks[wk],paid);
    total+=r.total; per.push(r);
    r.won.forEach(x=>{ paid[x[0]]=Math.max(paid[x[0]]||0,x[1]); });
    for(const id in s.sets) if(EX[id]) best[id]=mergeBest(id,best[id],setsPeak(id,s.sets[id]));
  });
  return {total:total, best:best, per:per, weeks:weeks, paid:paid};
}
/* Consecutive weeks of three sessions, counting back. This week only breaks the
   run once it is over, so a Monday never looks like a failure. */
/* This week against the plan, and how many weeks have met it. Nothing resets: a
   missed week costs nothing here, and every full one is kept. */
function weekTally(weeks){
  return {now:weeks[weekKey(today())]||0,
          full:Object.values(weeks).filter(n=>n>=PLAN.perWeek).length};
}
/* The half-finished session in front of you, scored as if you stopped now. */
function draftSets(){
  const out={};
  for(const id in draft){
    const v=draft[id].filter(x=>x.tk && +x.reps>0).map(x=>({kg:+x.kg||0,reps:+x.reps,v:x.v}));
    if(v.length) out[id]=v;
  }
  return out;
}
function xpLive(){
  const l=ledger();
  const sets=draftSets();
  if(!Object.keys(sets).length) return {base:l.total, live:0, lines:[], ledger:l, r:null};
  const last=DB.sess[DB.sess.length-1];
  const wk=weekKey(today());
  const r=xpForSession({w:pick,sets:sets}, l.best, last?daysAgo(last.d):null, (l.weeks[wk]||0)+1, l.paid);
  return {base:l.total, live:r.total, lines:r.lines, ledger:l, r:r};
}
/* A set is a record if it beats every earlier session and everything already
   logged today. Weighted lifts are judged set by set; bodyweight lifts are judged
   on the session total, so the flag lands on the set that breaks the old total. */
function isRecord(id,ix){
  const d=draft[id] && draft[id][ix];
  if(!d || !d.tk || !(+d.reps>0)) return false;
  const best=ledger().best[id];
  if(!best) return false;                       // first time out is a baseline
  if(EX[id].bw){
    let upto=0, before=0;
    draft[id].forEach((c,i)=>{
      if(!c.tk || !(+c.reps>0) || i>ix) return;
      upto+=+c.reps; if(i<ix) before+=+c.reps;
    });
    return upto>best.tot && before<=best.tot;
  }
  const earlier=draft[id].filter((c,i)=>i<ix && c.tk && +c.reps>0)
    .map(c=>({kg:+c.kg||0,reps:+c.reps}));
  const bar=mergeBest(id,best,setsPeak(id,earlier));
  return beatsBest(id,setsPeak(id,[{kg:+d.kg||0,reps:+d.reps}]),bar);
}
/* The number floats where the set was tapped, so the reward lands on the thing
   that earned it rather than in a corner of the screen. */
function xpPop(rect,gain){
  if(!(gain>0)) return;
  const p=document.createElement('div');
  p.className='xppop';
  p.textContent='+'+gain+' XP';
  const r=rect||{top:window.innerHeight*0.55,height:0,right:window.innerWidth-28};
  p.style.left=Math.round(r.right-52)+'px';          // inside the row, past the tick
  p.style.top=Math.max(64,Math.round(r.top-10))+'px';  // above it, never under the header
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),2200);
  const fill=document.getElementById('xpFill');
  if(fill){ fill.classList.remove('bump'); void fill.offsetWidth; fill.classList.add('bump'); }
}
function lvlPop(L){
  const p=document.createElement('div');
  p.className='xppop lvl';
  p.textContent='CLEARANCE '+L.lvl+' \u00b7 '+L.rank;
  p.style.top=Math.round(viewH()*0.24)+'px';   // high on the glass, clear of the sets
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),2700);
  try{ navigator.vibrate && navigator.vibrate([25,60,25]); }catch(e){}
}
let XPWAS=-1;
function paintXp(){
  const cap=document.getElementById('xpCap'), fill=document.getElementById('xpFill');
  if(!cap) return;
  const x=xpLive(), L=levelOf(x.base+x.live);
  /* Exact progress to the next clearance, mirrored by the bar. */
  cap.innerHTML='CLEARANCE '+L.lvl+' \u00b7 '+L.into+' / '+L.need+
    (x.live?' <b>+'+x.live+'</b>':'');
  const pct=Math.round(L.into/L.need*100);
  /* Light the stretch between where the bar was and where it is going, so the gain
     is visible as a length of bar rather than a number somewhere else. */
  if(XPWAS>=0 && pct>XPWAS) xpSpark(XPWAS,pct);
  XPWAS=pct;
  if(fill) fill.style.width=pct+'%';
}
/* The stretch just earned, torn through its own displacement field. Same idea as a
   page change: a hard tear, a couple of smaller ones, settling to nothing — stepped
   so it snaps between states instead of easing through them. */
let XPIV=null, XPEND=null;
function xpSpark(from,to){
  const sp=document.getElementById('xpSpark'); if(!sp) return;
  sp.style.left=from+'%';
  sp.style.width=Math.max(1.5,to-from)+'%';
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(XPIV){ clearInterval(XPIV); XPIV=null; }
  if(XPEND){ clearTimeout(XPEND); XPEND=null; }
  sp.classList.remove('off');
  sp.classList.add('on');
  if(reduce || ios()){
    XPEND=setTimeout(()=>{ sp.classList.add('off'); sp.classList.remove('on'); },900);
    return;
  }
  const F=[[54,'0.006 0.34'],[12,'0.002 0.12'],[44,'0.008 0.42'],[7,'0.001 0.08'],
           [34,'0.005 0.30'],[5,'0.002 0.14'],[22,'0.007 0.38'],[3,'0.001 0.09'],
           [13,'0.004 0.22'],[6,'0.002 0.12'],[0,'0.003 0.16']];
  const disp=document.getElementById('xpwarpDisp'), noise=document.getElementById('xpwarpNoise');
  const dur=1150;
  let i=0;
  const step=()=>{
    const f=F[i++];
    if(!f) return;
    if(disp) disp.setAttribute('scale',f[0]);
    if(noise){ noise.setAttribute('baseFrequency',f[1]); noise.setAttribute('seed',Math.floor(RND(1,90))); }
  };
  step();
  XPIV=setInterval(step, Math.round(dur/F.length));
  XPEND=setTimeout(()=>{
    clearInterval(XPIV); XPIV=null; XPEND=null;
    if(disp) disp.setAttribute('scale',0);
    sp.classList.add('off');
    sp.classList.remove('on');
  }, dur);
}

/* ---------- set order ---------- */
function seq(){
  const out=[], used={};
  if(!pick || !W[pick]) return out;      // called between a save and the next render
  W[pick].ex.forEach(id=>{
    if(used[id]) return;
    const g=pairOf(id)||[id];
    g.forEach(x=>{used[x]=1});
    const m=Math.max.apply(null,g.map(x=>setsFor(x)));
    for(let i=0;i<m;i++) g.forEach(x=>{ if(i<setsFor(x)) out.push(x+'-'+i); });
  });
  return out;
}
function nextKey(){
  return seq().find(k=>{
    const p=k.lastIndexOf('-'), id=k.slice(0,p), i=+k.slice(p+1);
    const c=draft[id] && draft[id][i];
    return !(c && c.tk);
  }) || null;
}
let saving=false;
/* From the moment a session is saved until the dashboard has moved on behind the
   debrief: the finished session is still on screen but must not be touched. */
let closing=false;
/* Every set logged means the workout is over — bank it without another tap.
   The Save button stays for the nights you stop early; a short session still counts. */
function autoSaveIfDone(){
  if(saving || closing || pick===null || !DB.sess) return;
  if(nextKey()) return;                       // still sets outstanding
  let any=false;
  for(const id in draft) if(draft[id].some(x=>+x.reps>0)) any=true;
  if(!any) return;
  saving=true;
  setTimeout(()=>{ saveSession(); saving=false; }, 700);
}
function ticked(k){
  const q=k.lastIndexOf('-'), c=draft[k.slice(0,q)], cell=c && c[+k.slice(q+1)];
  return !!(cell && cell.tk);
}
function setsDone(){
  return seq().filter(ticked).length;
}
function updateStrip(){
  paintXp();
  const total=seq().length, done=setsDone();
  const t=document.getElementById('stripSets'), g=document.getElementById('stripSeg');
  if(g && g.children.length!==total) g.innerHTML=Array(total+1).join('<b></b>');
  if(t) t.textContent = done ? done+' / '+total+' CLEARED' : total+' OBJECTIVES';
  if(g) [...g.children].forEach((b,i)=>b.className = i<done ? 'on' : '');
}
/* A tick is live on the set you are on and on sets already logged (to clear them).
   Every other row's tick is dead, so a stray press cannot log a set out of order. */
/* Completing a card hides its target line and its briefing, so the card loses
   about a third of its height the instant the last set lands and everything below
   it snaps upward. Measure the card before and after the class goes on and glide
   between the two heights, so the page settles instead of jumping. Returns how
   long that will take, so whatever runs next can wait for it. */
const CARDFOLD=700;
function foldCard(card,done){
  if(!card) return 0;
  const was=card.classList.contains('cdone');
  if(was===done) return 0;
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ card.classList.toggle('cdone',done); return 0; }
  const h0=card.offsetHeight;
  card.classList.toggle('cdone',done);
  const h1=card.offsetHeight;
  if(h0===h1) return 0;
  card.style.height=h0+'px';
  card.style.overflow='hidden';
  void card.offsetHeight;                       // commit the start height
  card.style.transition='height '+CARDFOLD+'ms cubic-bezier(.22,.72,.28,1)';
  card.style.height=h1+'px';
  clearTimeout(card._fold);
  card._fold=setTimeout(()=>{
    card.style.height=''; card.style.overflow=''; card.style.transition='';
  },CARDFOLD+40);
  return CARDFOLD;
}
/* A block is shut to its title line until it is the one being worked, and opens
   by gliding its own height rather than appearing. Manual presses are respected;
   the automatic opening only steps in when the block being worked changes. */
let LIVEBLK='';
function blockOpen(ch,open,quiet){
  if(!ch) return 0;
  const body=ch.querySelector('.cbody'), head=ch.querySelector('.chead');
  if(!body) return 0;
  const shut=ch.classList.contains('shut');
  if(shut!==open) return 0;                       // already where it should be
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  clearTimeout(body._fold);
  body.style.height=''; body.style.transition=''; body.style.overflow='';
  const h0=body.offsetHeight;                     // measure before the class lands
  ch.classList.toggle('shut',!open);
  if(head) head.setAttribute('aria-expanded',open?'true':'false');
  if(reduce||quiet) return 0;
  const h=body.scrollHeight;              // what it wants to be in the new state
  body.style.height=h0+'px';
  body.style.overflow='hidden';
  void body.offsetHeight;
  body.style.transition='height '+CARDFOLD+'ms cubic-bezier(.22,.72,.28,1)';
  body.style.height=h+'px';
  clearTimeout(body._fold);
  body._fold=setTimeout(()=>{
    body.style.height=''; body.style.overflow=''; body.style.transition='';
  },CARDFOLD+40);
  return CARDFOLD;
}
/* Whichever block the next set lives in is the one that should be open. */
function syncBlocks(){
  const k=nextKey();
  const ex=k ? k.slice(0,k.lastIndexOf('-')) : '';
  const g=ex ? (pairOf(ex)||[ex]) : null;
  const key=g ? g[0] : '';
  if(!T.start){ LIVEBLK=''; return 0; }
  if(key===LIVEBLK) return 0;                     // nothing moved, leave his choices alone
  LIVEBLK=key;
  let ms=0;
  document.querySelectorAll('.chain').forEach(c=>{
    ms=Math.max(ms, blockOpen(c, c.dataset.blk===key));
  });
  return ms;
}
/* Every block shut, nothing pinned, and no record of a block being worked — because
   after a reset none is. Leaving a key here makes the next START SESSION look like a
   block that has not changed, and open nothing. */
function resetBlocks(){
  document.querySelectorAll('.chain').forEach(c=>{
    if(!c.classList.contains('shut')){
      blockOpen(c,false);                 // folds, the same as any other close
      return;
    }
    const body=c.querySelector('.cbody');
    if(body){                             // already shut: just make sure nothing is pinned
      clearTimeout(body._fold);
      body.style.height=''; body.style.transition=''; body.style.overflow='';
    }
  });
  LIVEBLK='';
}
function syncTicks(){
  document.querySelectorAll('.setbtn').forEach(b=>{
    const t=b.querySelector('.sc'); if(!t) return;
    const live = T.start && (b.classList.contains('now') || b.classList.contains('on'));
    t.disabled = !live;
    b.classList.toggle('dead', !live);
  });
}
function updateNext(scroll){
  updateStrip();
  const k=nextKey();
  document.querySelectorAll('.card.up').forEach(c=>c.classList.remove('up'));
  document.querySelectorAll('.setbtn.now').forEach(b=>b.classList.remove('now'));
  document.querySelectorAll('.setbtn.mate').forEach(b=>b.classList.remove('mate'));
  document.querySelectorAll('.chain.live').forEach(c=>c.classList.remove('live'));
  document.querySelectorAll('.setbtn.on').forEach(b=>b.classList.remove('now','arming'));
  document.documentElement.classList.toggle('session', !!T.start);
  if(!T.start){ LIVEBLK=''; syncTicks(); return; }   // nothing is "current" yet, and
                                                     // no block is the live one
  if(k){ const b=document.getElementById('sb-'+k); if(b) b.classList.add('now'); }
  let fold=syncBlocks();
  for(const id in draft){
    const card=document.getElementById('cd-'+id);
    if(card) fold=Math.max(fold, foldCard(card, draft[id].every(x=>x.tk)));
  }
  document.querySelectorAll('.chain').forEach(c=>{
    const cards=[...c.querySelectorAll('.card')];
    c.classList.toggle('cdone', cards.length>0 && cards.every(x=>x.classList.contains('cdone')));
  });
  if(!k){ syncTicks(); document.documentElement.classList.remove('session'); autoSaveIfDone(); return; }
  const kid=k.slice(0,k.lastIndexOf('-')), kix=+k.slice(k.lastIndexOf('-')+1);
  const card=document.getElementById('cd-'+kid);
  if(card) card.classList.add('up');
  /* The other lifts in the chain at this same round are what comes next after this
     set — mark them so the round reads as one thing on the screen. */
  /* The frame in focus is lit at full strength, a lone lift's as much as a chain's —
     otherwise the session dimming holds it at the level of the blocks waiting. */
  const g=pairOf(kid);
  const frame=document.getElementById('ch-'+(g ? g[0] : kid)); if(frame) frame.classList.add('live');
  if(g && g.length>1){
    g.forEach(x=>{
      if(x===kid || kix>=setsFor(x)) return;
      const cell=draft[x] && draft[x][kix];
      if(cell && cell.tk) return;
      const b=document.getElementById('sb-'+x+'-'+kix); if(b) b.classList.add('mate');
    });
  }

  syncTicks();
  const row=document.getElementById('sb-'+k);
  if(scroll && row){
    /* A card folding shut moves everything under it, so the scroll target is not
       where it will be. Let the fold finish first, then go. */
    if(fold) setTimeout(scrollToNext, fold - 60);
    else scrollToNext();
    row.classList.add('flash');
    setTimeout(()=>row.classList.remove('flash'),900);
  }
}
/* The next set is often behind you — the chain sends you back up to the squat after
   the curl — so never assume it is further down the page. Work out where it actually
   is and put it in the band between the top of the screen and the fixed bar, showing
   the card heading with it when the whole card fits. */
/* Hand-rolled so the pace is ours: the browser's own smooth scroll is fast and
   varies by device. Eases in and out, and any touch cancels it. */
/* body is the scroller (see the html/body rule), so every read and write goes here */
const scrY=()=>document.body.scrollTop;
const scrTo=y=>{ document.body.scrollTop=y; };
let SCROLLA=0;
/* The glide to the next set, and the check that follows it once it has landed. */
const SCROLLGLIDE=1150;
function glideTo(y,ms){
  const max=Math.max(0,document.body.scrollHeight-viewH());
  y=Math.min(max,Math.max(0,y));
  const from=scrY(), d=y-from;
  if(Math.abs(d)<2) return;
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ scrTo(y); return; }
  /* Date.now throughout: the timestamp rAF hands back has a different origin. */
  const id=++SCROLLA, t0=Date.now(), dur=ms||700;
  const ease=t=>t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
  const step=()=>{
    if(id!==SCROLLA) return;
    const p=Math.min(1,(Date.now()-t0)/dur);
    scrTo(from+d*ease(p));
    if(p<1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
window.addEventListener('touchstart',()=>{ SCROLLA++; },{passive:true});
let SCROLLFIX=0;
function scrollToNext(){
  const k=nextKey(); if(!k) return;
  const row=document.getElementById('sb-'+k); if(!row) return;
  syncPad();
  /* Centre the next set in the space above the bar, wherever it is. */
  const fh=fabH(), top=scrY(), vh=viewH(), band=vh-fh;
  const rowTop=row.getBoundingClientRect().top+top;
  const want=rowTop-(band-row.offsetHeight)/2;
  if(Math.abs(want-top)>24) glideTo(want,SCROLLGLIDE);
  /* Smooth scrolling can be cut short, the toolbar can slide back in, and the bar
     can grow a line mid-session. Check once the movement has settled and nudge. */
  clearTimeout(SCROLLFIX);
  SCROLLFIX=setTimeout(()=>{
    if(nextKey()!==k || document.querySelector('.sheet')) return;
    const r=row.getBoundingClientRect(), floor=viewH()-fabH()-12;
    if(r.bottom>floor+2) glideTo(scrY()+(r.bottom-floor+8),480);
    else if(r.top<6) glideTo(scrY()+(r.top-16),480);
  },SCROLLGLIDE+150);
}

/* ---------- state ---------- */
let pick=null, draft={};

/* ---------- render: train ---------- */
function rTrain(){
  if(!T.start) applySwaps();
  const n=nextWorkout(); if(pick===null)pick=n;
  const lt=lastTrained();
  const sn=DB.sess.length;
  document.getElementById('hdrK').textContent='OP '+String(sn+1).padStart(3,'0');
  document.getElementById('hdrT').textContent='OPERATION '+pick;
  document.getElementById('hdrS').innerHTML =
    (lt===null?'NO PRIOR INTEL':lt===0?'TRAINED TODAY':lt+'D SINCE LAST')+
    ' \u00b7 '+weekTally(ledger().weeks).now+'/'+PLAN.perWeek+' THIS WEEK'+
    ' <button class="swap" id="swapW">SWAP \u2192 '+(pick==='A'?'B':'A')+'</button>';

  let h='';
  if(!T.start) h+='<button class="startbtn" id="startS">[ START SESSION ]</button>';

  /* Render block by block rather than exercise by exercise: a chain is one frame. */
  const blocks=[], seenEx={};
  W[pick].ex.forEach(id=>{
    if(seenEx[id]) return;
    const g=pairOf(id)||[id];
    g.forEach(x=>{seenEx[x]=1});
    blocks.push(g);
  });

  blocks.forEach((g,bi)=>{
    const chained=g.length>1;
    /* A single lift gets the same frame as a chain, so it collapses and opens the
       same way. It is labelled with the lift rather than a superset number. */
    h+='<div class="chain'+(chained?'':' solo')+' shut" id="ch-'+g[0]+'" data-blk="'+g[0]+'">'+
      '<button class="chead" type="button" data-open="'+g[0]+'" aria-expanded="false">'+
        (chained?'<span class="cx">SUPERSET '+(bi+1)+'</span>':'')+
        '<span class="cgap"></span>'+
        '<span class="cch" aria-hidden="true">+</span>'+
      '</button><div class="cbody">';

    g.forEach((id,gi)=>{
    const e=EX[id], p=prescribe(id);
    const ns=setsFor(id);
    if(!draft[id] || draft[id].length!==ns)
      draft[id]=Array.from({length:ns},(_,i)=>(draft[id]&&draft[id][i])||{kg:p.kg===''?'':p.kg,reps:''});
    const cdone=draft[id].every(x=>x.tk);
    h+='<div class="card'+(cdone?' cdone':'')+'" id="cd-'+id+'">'+
      '<h3>'+e.n+(e.side?' <em>per side</em>':'')+'</h3>'+
      '<div class="tgt'+(p.up?' up':'')+'">'+
        '<span class="tv">'+(e.bw?((p.v?esc(p.v)+' \u00b7 ':'')+'to '+(p.tgt||e.hi)+' reps')
          :(p.kg||'\u2014')+'kg \u00d7 '+(p.tgt||e.lo+'\u2013'+e.hi))+'</span>'+
        (p.up?'<span class="tup">\u25b2 UP</span>':'')+(p.down?'<span class="tup">\u25bc DOWN</span>':'')+
        (p.near?'<span class="tup near">'+p.near.reps+' REP'+(p.near.reps>1?'S':'')+' TO '+kgTxt(p.near.kg)+'KG</span>':'')+
      '</div>'+
      (capWarn(id,p.kg)?'<div class="capwarn">'+esc(capWarn(id,p.kg))+'</div>':'')+
      (function(){
        const ls=p.last||[];
        if(!ls.length) return '';
        const same=!e.bw && ls.every(x=>x.kg===ls[0].kg);
        return '<div class="prev"><span class="pk">PREV</span>'+
          (same?'<span class="pw">'+kgTxt(ls[0].kg)+'kg</span>':'')+
          ls.map(x=>'<span class="pc">'+((!e.bw&&!same)?kgTxt(x.kg)+'\u00d7':'')+x.reps+'</span>').join('')+
          (e.bw&&ls.v?'<span class="pw">'+esc(ls.v.toLowerCase())+'</span>':'')+
        '</div>';
      })();
    for(let s=0;s<ns;s++){
      const d=draft[id][s], on=!!d.tk;
      h+='<div class="setbtn'+(on?' on':'')+(d.pending&&!on?' arming':'')+(T.start?'':' locked')+
         '" id="sb-'+id+'-'+s+'" data-x="'+id+'" data-s="'+s+'" role="group"'+
         ' aria-label="'+esc(e.n)+' set '+(s+1)+'">'+
         '<span class="sl">SET '+(s+1)+'</span>'+
         setFields(id,s)+
         '<span class="sd"></span>'+
         '<span class="rb'+(on&&isRecord(id,s)?'':' hide')+'">REC</span>'+
         '<button class="sc" type="button" aria-label="Confirm set '+(s+1)+'">\u2713</button>'+
         '</div>';
    }
    h+='<div class="brief" data-t="p"><div class="btabs">'+
        '<button class="bsum" type="button" data-br="'+id+'" data-t="p">PROGRESSION</button>'+
        '<button class="bsum" type="button" data-br="'+id+'" data-t="f">BRIEFING</button></div>'+

function saveSession(){
  if(closing) return;               // already saved; the debrief is on its way
  const sets={}; let n=0;
  for(const id in draft){
    const v=draft[id].filter(x=>+x.reps>0).map(x=>{
      const r={kg:+x.kg||0,reps:+x.reps};
      if(EX[id].bw && x.v) r.v=x.v;
      return r;
    });
    if(v.length){sets[id]=v;n+=v.length}
  }
  if(!n){toast('Log at least one set');return}
  const before=ledger().total;
  DB.sess.push({id:sessId(today(),pick,DB.sess), d:today(), w:pick, sets, e:Date.now()});
  touch(); closing=true;
  /* The finished session stays on screen until the debrief has tuned in over it
     (0.46 s, the sheet's fuzzin); only then does the dashboard behind it move on to
     the next operation, so the reset is never seen. No scrolling here — the page
     returns to the top once he closes the debrief. */
  setTimeout(()=>{
    debrief(before);
    setTimeout(()=>{
      draft={}; pick=nextWorkout(); resetTimer(); rTrain(); refreshCog();
      closing=false;
    },540);
  },450);
}

/* Each lift in this session against its first logged session: heavier, or more
   reps at the same weight. Bodyweight lifts compare reps at the same assistance.
   The biggest gains first, three at most. */
function gains(s){
  const out=[];
  Object.keys(s.sets||{}).forEach(id=>{
    const e=EX[id], f=DB.sess.find(x=>x!==s && x.sets && x.sets[id]);
    const a=f && setsPeak(id,f.sets[id]), b=setsPeak(id,s.sets[id]);
    if(!a || !b) return;
    if(e.bw){
      const va=(f.sets[id].find(x=>x.v)||{}).v, vb=(s.sets[id].find(x=>x.v)||{}).v;
      if(va===vb && b.reps>a.reps) out.push({n:e.n, g:b.reps/a.reps, txt:a.reps+' \u2192 '+b.reps+' reps'});
    } else if(b.kg>a.kg){
      out.push({n:e.n, g:b.kg/a.kg, txt:kgTxt(a.kg)+' \u2192 '+kgTxt(b.kg)+'kg'});
    } else if(b.kg===a.kg && b.reps>a.reps){
      out.push({n:e.n, g:b.reps/a.reps, txt:kgTxt(a.kg)+'kg \u00b7 '+a.reps+' \u2192 '+b.reps+' reps'});
    }
  });
  return out.sort((x,y)=>y.g-x.g).slice(0,3);
}

/* ---------- progress ----------
   Whether each muscle is getting the weekly sets the programme claims. Weight, waist
   and photos are kept in another app. */

/* Sets are credited in full to what a lift is built for and at half to what it
   assists, which is the usual way of counting weekly volume. */
const VOL={
  gsq:{Quads:1,Glutes:1,Abs:.5}, spl:{Quads:1,Glutes:.5},
  ht:{Glutes:1}, sht:{Glutes:1}, tgs:{Quads:1,Glutes:1,Abs:.5}, bp:{Chest:1,Triceps:.5,Shoulders:.5},
  dip:{Chest:1,Triceps:1,Shoulders:.5}, ohp:{Shoulders:1,Triceps:.5},
  lr:{Shoulders:1}, row:{Back:1,Biceps:.5}, csr:{Back:1,Biceps:.5},
  pu:{Back:1,Biceps:.5}, cur:{Biceps:1}, tri:{Triceps:1}, hkr:{Abs:1}
};
const MUSCLES=['Chest','Back','Shoulders','Biceps','Triceps','Quads','Glutes','Abs'];
/* Sets a week, measured over however long the log actually covers. Dividing four
   weeks of sets by four when only three of them have been trained is what made the
   number read low. No targets sit beside it: the programme decides the volume, and
   a bar that is permanently short of a line is a reason to stop rather than start. */
function volume(days){
  const out={};
  MUSCLES.forEach(m=>out[m]=0);
  DB.sess.forEach(s=>{
    if(daysAgo(s.d)>=days) return;
    for(const id in s.sets){
      const v=VOL[id]; if(!v) continue;
      const n=s.sets[id].filter(x=>+x.reps>0).length;
      for(const m in v) out[m]+=n*v[m];
    }
  });
  return out;
}
function volWeek(){
  const out={}; MUSCLES.forEach(m=>out[m]=0);
  const first=DB.sess.find(x=>daysAgo(x.d)<28 && x.sets && Object.keys(x.sets).length);
  if(!first) return out;
  const wks=Math.max(1,(daysAgo(first.d)+1)/7);
  const v=volume(28);
  MUSCLES.forEach(m=>out[m]=Math.round(v[m]/wks*10)/10);
  return out;
}
/* A single bell caps at 40kg, so the lifts loaded with one need warning before the
   ceiling arrives rather than on the night it does. */
const BELL_CAP=40;
const CAPPED={gsq:1, ht:1, tgs:1, sht:1};
function capWarn(id,kg){
  if(!CAPPED[id] || !kg) return '';
  const left=DIAL.filter(x=>x>kg && x<=BELL_CAP).length;
  if(left>2) return '';
  const to=SWAP[id]?EX[SWAP[id]].n.toLowerCase():'';
  if(left<=0) return to
    ? 'Top of the bell. '+EX[id].hi+' on every set and this becomes '+to+'.'
    : 'Top of the bell. Add reps, slow the lowering, or pause each rep.';
  return left+' step'+(left===1?'':'s')+' left on the bell.'+(to?' Then it becomes '+to+'.':'');
}

/* The row in settings: sets a week, on average, over the same four weeks that the
   per-muscle figures use. */
function progSub(){
  const recent=DB.sess.filter(x=>daysAgo(x.d)<28 && x.sets && Object.keys(x.sets).length);
  if(!recent.length) return 'NO SETS IN 4 WEEKS';
  const wks=Math.max(1,(daysAgo(recent[0].d)+1)/7);
  const n=recent.reduce((a,x)=>a+Object.values(x.sets).reduce((b,v)=>b+v.filter(r=>+r.reps>0).length,0),0);
  return Math.round(n/wks)+' SETS A WEEK';
}
/* A shared editor for a single number: the weight and reps of a set logged days ago. */

/* ---------- session history ----------
   Every session in the log, newest first: what was done, at what weight, for how
   many reps. One session open at a time so the list stays scannable. */
const MONTHS=['January','February','March','April','May','June','July',
              'August','September','October','November','December'];
function ord(n){ const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function longDate(iso){
  const p=(iso||'').split('-');
  return p.length===3 ? ord(+p[2])+' '+MONTHS[+p[1]-1]+' '+p[0].slice(2) : (iso||'');
}
/* One row per lift on a grid, so the weight and each set sit in the same column all
   the way down the session however long the lift's name is. */
/* Corrections. A set logged wrong days ago can be fixed or removed here, and a
   session that should never have been saved can go entirely. */
function editSet(si,id,ix){
  const s=DB.sess[si], e=EX[id], row=s.sets[id][ix];
  numSheet({
    title:e.n, note:longDate(s.d)+' \u00b7 set '+(ix+1)+(e.bw?' \u00b7 reps only':''),
    two:!e.bw, a:e.bw?row.reps:row.kg, b:e.bw?undefined:row.reps,
    stepA:e.bw?'1':'0.5', phA:e.bw?'reps':'kg', phB:'reps',
    loA:e.bw?1:0.5, hiA:e.bw?200:200, loB:1, hiB:200,
    back:openHistory,
    onSave:(a,b)=>{
      if(e.bw) row.reps=Math.round(a);
      else { row.kg=a; row.reps=Math.round(b); }
      s.e=Date.now(); touch(); toast('UPDATED'); openHistory();
    },
    onDel:()=>{
      s.sets[id].splice(ix,1);
      if(!s.sets[id].length) delete s.sets[id];
      s.e=Date.now(); touch(); toast('SET REMOVED'); openHistory();
    }});
}
async function delSession(si){
  const s=DB.sess[si];
  const ok=await askConfirm('Delete this session?',
    longDate(s.d)+' and everything logged in it. It cannot be undone.','Delete');
  if(!ok) return openHistory();
  drop(s.id); DB.sess.splice(si,1); touch(); toast('SESSION DELETED'); rTrain(); openHistory();
}
function histSets(id,v,si){
  const e=EX[id]||{n:id};
  const done=(v||[]).filter(x=>+x.reps>0);
  if(!done.length) return '';
  const bw=e.bw, kgs=done.map(x=>+x.kg||0);
  const same=!bw && kgs.every(k=>k===kgs[0]);
  let cells='';
  for(let i=0;i<3;i++){
    const x=done[i];
    cells += x ? '<button class="pc" data-fix="'+si+':'+id+':'+(v.indexOf(x))+'">'+
                   ((!bw&&!same)?kgTxt(+x.kg||0)+'\u00d7':'')+x.reps+'</button>'
               : '<span class="pc blank"></span>';
  }
  return '<div class="hex"><span class="hn">'+esc(e.n||id)+'</span>'+
    '<span class="pw">'+(same?kgTxt(kgs[0])+'kg':'')+'</span>'+cells+'</div>';
}
function histOpen(i){
  const box=document.querySelector('.hhead[data-h="'+i+'"]');
  if(!box) return;
  const sess=box.parentNode, body=document.getElementById('hb-'+i);
  const sheet=sess.closest('.sheet');
  const was=sess.classList.contains('open');
  const mark=sess.getBoundingClientRect().top;
  document.querySelectorAll('.hsess.open').forEach(o=>{
    if(o===sess) return;
    const b=o.querySelector('.hbody');
    b.classList.remove('anim'); b.style.height='0px';     // shut instantly
    o.classList.remove('open');
  });
  /* whatever closed above us has moved this row; put it back under the finger */
  const moved=sess.getBoundingClientRect().top-mark;
  if(sheet && Math.abs(moved)>1) sheet.scrollTop+=moved;
  if(was){
    body.classList.add('anim');
    body.style.height=body.scrollHeight+'px';
    requestAnimationFrame(()=>{ body.style.height='0px'; });
    sess.classList.remove('open');
    return;
  }
  sess.classList.add('open');
  const mon=sess.closest('.hmbody');
  if(mon && mon.style.height && mon.style.height!=='auto') mon.style.height='auto';
  body.classList.add('anim');
  body.style.height='0px';
  requestAnimationFrame(()=>{ body.style.height=body.scrollHeight+'px'; });
  const done=e=>{
    if(e.propertyName!=='height') return;
    body.removeEventListener('transitionend',done);
    if(sess.classList.contains('open')) body.style.height='auto';
  };
  body.addEventListener('transitionend',done);
}
function openHistory(){

     closed: the list opens as a clean index and nothing is scrolled past. */

      const rest=Object.keys(s2.sets).filter(x=>order.indexOf(x)<0);
      const body=order.concat(rest).map(id=>s2.sets[id]?histSets(id,s2.sets[id],i):'').join('')
        || '<div class="hnone">Logged before this app \u2014 no set detail.</div>';
      const first=false;
      inner+='<div class="hsess'+(first?' open':'')+'">'+
        '<button class="hhead" data-h="'+i+'">'+
          '<span class="ho">OP '+String(i+1).padStart(3,'0')+'</span>'+
          '<span class="hw">'+s2.w+'</span>'+
          '<span class="hd">'+esc(longDate(s2.d))+'</span>'+
          '<span class="hg">'+(pr.grade||'')+'</span>'+
        '</button>'+
        '<div class="hbody" id="hb-'+i+'"'+(first?' style="height:auto"':'')+'>'+
          '<div class="hinner">'+body+
          '<button class="btn ghost hdel" data-del="'+i+'">[ DELETE SESSION ]</button>'+
          '</div></div></div>';
    });
    h+='<div class="hmon'+(open?' open':'')+'">'+
       '<button class="hmhead" data-m="'+mi+'">'+
         '<span class="hmn">'+esc(label)+'</span>'+
         '<span class="hmc">'+g.idx.length+' OP'+(g.idx.length===1?'':'S')+'</span>'+
       '</button>'+
       '<div class="hmbody" id="hm-'+mi+'"'+(open?' style="height:auto"':'')+'>'+inner+'</div></div>';
  });
  h+='</div></div></div>';
  setSheet(h);
  document.getElementById('veil').onclick=closeSheet;
  document.getElementById('hiClose').onclick=openSettings;   // back where it was opened from
  document.querySelectorAll('.hmhead').forEach(head=>{
    head.onclick=()=>monthOpen(head.dataset.m);
  });
  document.querySelectorAll('.hhead').forEach(head=>{
    head.onclick=()=>histOpen(head.dataset.h);
  });
  document.querySelectorAll('[data-fix]').forEach(b=>{
    b.onclick=()=>{ const p=b.dataset.fix.split(':'); editSet(+p[0],p[1],+p[2]); };
  });

/* Months open and close the same way sessions do, and a month left open is left at
   its natural height so a session expanding inside it still fits. */
function monthOpen(mi){
  const head=document.querySelector('.hmhead[data-m="'+mi+'"]');
  if(!head) return;
  const mon=head.parentNode, body=document.getElementById('hm-'+mi);
  const sheet=mon.closest('.pgbody')||mon.closest('.sheet');
  const was=mon.classList.contains('open');
  const mark=mon.getBoundingClientRect().top;
  document.querySelectorAll('.hmon.open').forEach(o=>{
    if(o===mon) return;
    const b=o.querySelector('.hmbody');
    b.classList.remove('anim'); b.style.height='0px';
    o.classList.remove('open');
  });
  const moved=mon.getBoundingClientRect().top-mark;
  if(sheet && Math.abs(moved)>1) sheet.scrollTop+=moved;
  if(was){
    body.classList.add('anim');
    body.style.height=body.scrollHeight+'px';
    requestAnimationFrame(()=>{ body.style.height='0px'; });
    mon.classList.remove('open');
    return;
  }
  mon.classList.add('open');
  body.classList.add('anim');
  body.style.height='0px';
  requestAnimationFrame(()=>{ body.style.height=body.scrollHeight+'px'; });
  const done=e=>{
    if(e.propertyName!=='height') return;
    body.removeEventListener('transitionend',done);
    if(mon.classList.contains('open')) body.style.height='auto';
  };
  body.addEventListener('transitionend',done);
}

/* Drag a row sideways past frac of its width to run fn; a short drag springs back. */
function bindSwipe(el,dir,frac,fn){
  let x0=null, y0=0, on=false, go=false, moved=0;
  const reset=()=>{ x0=null; on=false; el.classList.remove('drag','ready'); el.style.setProperty('--dx','0px'); };
  el.addEventListener('pointerdown',e=>{ x0=e.clientX; y0=e.clientY; go=false; });
  el.addEventListener('pointermove',e=>{
    if(x0===null) return;
    const dx=Math.max(0,(e.clientX-x0)*dir), dy=Math.abs(e.clientY-y0);
    if(!on){
      if(dy>12 && dy>dx) return reset();
      if(dx<10) return;
      on=true; el.setPointerCapture(e.pointerId); el.classList.add('drag');
    }
    el.style.setProperty('--dx',dx+'px');
    go=dx>el.offsetWidth*frac;
    el.classList.toggle('ready',go);
  });
  el.addEventListener('pointerup',()=>{ const run=on&&go; if(on) moved=Date.now(); reset(); if(run) fn(); });
  el.addEventListener('pointercancel',reset);
  el.addEventListener('click',e=>{ if(Date.now()-moved<400){ e.stopPropagation(); e.preventDefault(); } },true);
}

async function exportFile(){

async function runExport(){
  const text=packDB(), name=backupName();
  /* Share first where it exists. Once the sheet has been handed the file, this
     function is done either way — it must never fall through to the download link
     as well, or the backup is written twice. */
  if(navigator.share && window.isSecureContext){
    let file=null;
    try{ file=new File([text], name, {type:'text/plain'}); }catch(e){}
    if(file && (!navigator.canShare || navigator.canShare({files:[file]}))){
      try{
        await navigator.share({files:[file], title:name});
        markBacked(); toast('EXPORTED');
      }catch(e){
        if(!e || e.name!=='AbortError') toast('SHARE FAILED');
      }
      return true;                  // handed over, whatever the outcome
    }
  }
  try{
    const b=new Blob([text],{type:'text/plain'}), u=URL.createObjectURL(b);
    const a=document.createElement('a'); a.href=u; a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(u); a.remove();},400);
    markBacked(); toast('SAVED '+name);
    return true;
  }catch(e){}
  toast('COULD NOT SAVE THE FILE');
  return false;
}

/* ---------- the rolling static ----------
   Each pass gets its own height, brightness, speed and travel, and the gap before
   the next one is random too, so it never settles into a rhythm. Roughly one pass
   in six stutters partway down; roughly one in twelve drifts upward instead. */
const RND=(a,b)=>a+Math.random()*(b-a);
/* A thin line of interference crossing the screen at a fixed rate, with a random
   pause before the next one so the cycle never reads as a metronome. It buzzes once
   per crossing, at a random point along the way, and never at any other time. */
const ROLLSEC=6.8;      // a slow drift down the glass
let BUZZT=0, BUZZING=false, ROLLBUZZ=0;
function buzz(el){
  if(BUZZING) return;                 // one flurry at a time, never overlapping
  BUZZING=true;
  /* At rest it is barely there. The buzz is the moment it bites: the static jumps,
     the torn lines come up, and the blur on whatever is behind it trebles. */
  const hit=()=>{
    el.style.setProperty('--sk',RND(-3.4,3.4).toFixed(2)+'deg');
    el.style.setProperty('--tx',Math.round(RND(-18,18))+'px');
    el.style.setProperty('--go',RND(.42,.66).toFixed(3));
    el.style.setProperty('--ln','1');
    el.style.setProperty('--bf',RND(1.8,3).toFixed(2)+'px');
    el.style.setProperty('--bc','1.2'); el.style.setProperty('--bb','1.1');
    el.style.opacity=RND(0.85,1.15).toFixed(2);
  };
  const rest=()=>{
    el.style.setProperty('--sk','0deg');
    el.style.setProperty('--tx','0px');
    el.style.setProperty('--go','.1');
    el.style.setProperty('--ln','.5');
    el.style.setProperty('--bf','.55px');
    el.style.setProperty('--bc','1.05'); el.style.setProperty('--bb','1.02');
    el.style.opacity=RND(0.4,0.62).toFixed(2);
    BUZZING=false; BUZZT=0;
  };
  let n=0; const shots=Math.round(RND(3,7));
  (function again(){
    hit(); n++;
    BUZZT = n<shots ? setTimeout(again,RND(28,70)) : setTimeout(rest,RND(40,90));
  })();
}
function rollPass(){
  const el=document.querySelector('.roll');
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!el || reduce) return;
  if(document.hidden || ios()) return setTimeout(rollPass,600);
  const vh=(window.visualViewport&&window.visualViewport.height)||window.innerHeight;
  const h=Math.round(RND(14,34));          // a line, never a band
  el.style.height=h+'px';
  el.style.opacity=RND(0.4,0.62).toFixed(2);
  const from=-h-10, to=vh+10;
  const rate=(vh+40)/ROLLSEC;              // fixed pixels per second
  const dur=Math.round((to-from)/rate*1000);
  let a;
  try{
    a=el.animate([{transform:'translate3d(0,'+from+'px,0)'},
                  {transform:'translate3d(0,'+to+'px,0)'}],
                 {duration:dur,easing:'linear'});
  }catch(e){ el.style.opacity=0; return setTimeout(rollPass,2000); }
  clearTimeout(ROLLBUZZ);
  ROLLBUZZ=setTimeout(()=>buzz(el), dur*RND(0.15,0.8));   // one buzz per crossing
  a.onfinish=()=>{
    clearTimeout(ROLLBUZZ);            // nothing buzzes between crossings
    el.style.opacity=0;
    /* Long, uneven gaps: the line is an occasional event, not a fixture. */
    setTimeout(rollPass, RND(6000,38000));
  };
}
/* Poor signal, drawn frame by frame. Each row takes its own base brightness before
   the per-pixel noise goes on top — that horizontal correlation is what separates
   television static from a field of random dots — and rows occasionally tear into a
   bright or black run. Redrawn about 24 times a second, and only while a line is
   actually on screen. */
let NCTX=null, NIMG=null, NLAST=0, NOCANVAS=false;
function drawStatic(){
  if(NOCANVAS) return;                       // asked once, refused; stop asking
  const el=document.querySelector('.roll');
  const cv=document.getElementById('rollCv');
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!cv || !el || reduce) return;
  requestAnimationFrame(drawStatic);
  const now=Date.now();
  if(now-NLAST < 42) return;                 // ~24 frames a second is plenty
  NLAST=now;
  if(document.hidden || +el.style.opacity===0) return;
  if(!NCTX){
    NCTX=cv.getContext && cv.getContext('2d');
    if(!NCTX){ cv.style.display='none'; NOCANVAS=true; return; }   // no canvas: drop the layer, keep the line
    NIMG=NCTX.createImageData(cv.width,cv.height);
  }
  paintNoise(NCTX,NIMG,cv.width,cv.height,BUZZING);
}
/* One frame of static. Each row takes its own base level before the per-pixel noise
   goes on, and rows sometimes tear into a blown-out or crushed run — that is what
   separates signal noise from a field of dots. */
function paintNoise(ctx,img,w,h,hot){
  const d=img.data;
  for(let y=0;y<h;y++){
    let base=RND(hot?40:20, hot?150:95);
    const tear=Math.random() < (hot?0.22:0.07);
    const tearAt=tear?Math.floor(RND(0,w)):-1;
    const tearLen=tear?Math.floor(RND(6,w*0.6)):0;
    const bright=Math.random()<0.6;
    for(let x=0;x<w;x++){
      let v=base+RND(-55,55);
      if(tear && x>=tearAt && x<tearAt+tearLen) v = bright? v+RND(60,130) : v*0.25;
      if(v<0) v=0; if(v>255) v=255;
      const i=(y*w+x)*4;
      d[i]=v; d[i+1]=v*1.03>255?255:v*1.03; d[i+2]=v*0.94;   // a touch of green
      d[i+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
}
/* ---------- the whole screen goes, once in a while ----------
   Not a layer over the top: the interface itself is pulled apart for a moment.
   Skipped while a sheet is open, so it never lands mid-entry. */
let FUZZING=false;
function screenFuzz(){
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce || document.hidden || ios() || document.querySelector('.sheet')) return fuzzNext();
  const root=document.documentElement;
  FUZZING=true;
  const dur=Math.round(RND(380,560));
  root.style.setProperty('--gdur',dur+'ms');
  root.classList.add('glitching');
  const st=document.createElement('div');
  st.className='uistatic';
  document.body.appendChild(st);
  setTimeout(()=>{
    root.classList.remove('glitching');
    root.style.removeProperty('--gdur');
    if(st.parentNode) st.parentNode.removeChild(st);
    FUZZING=false;
    fuzzNext();
  }, dur+40);
}
function fuzzNext(){ setTimeout(screenFuzz, RND(16000,55000)); }
/* One briefing open at a time. The trick to it not jerking: shut the others with no
   animation first, measure how far the tapped one moved as a result, and correct the
   scroll by that exact amount before the new one starts opening. */
function openBrief(id,t){
  const brief=document.querySelector('.bsum[data-br="'+id+'"]').closest('.brief');
  const body=document.getElementById('br-'+id);
  if(!brief||!body) return;
  const wasOpen=brief.classList.contains('open');
  if(wasOpen && brief.dataset.t!==t) return swapTab(brief,body,t);
  brief.dataset.t=t;
  const mark=brief.getBoundingClientRect().top;
  document.querySelectorAll('.brief.open').forEach(o=>{
    if(o===brief) return;
    const b=o.querySelector('.bbody');
    b.classList.remove('anim'); b.style.height='0px';       // instant, no animation
    o.classList.remove('open');
  });
  /* anything above us just collapsed, so the page has shifted under our finger */
  const moved=brief.getBoundingClientRect().top-mark;
  if(Math.abs(moved)>1) scrTo(Math.max(0,scrY()+moved));
  if(wasOpen){
    body.classList.add('anim');
    body.style.height=body.scrollHeight+'px';
    requestAnimationFrame(()=>{ body.style.height='0px'; });
    brief.classList.remove('open');
    return;
  }
  brief.classList.add('open');
  body.classList.add('anim');
  body.style.height='0px';
  requestAnimationFrame(()=>{ body.style.height=body.scrollHeight+'px'; });
  const done=e=>{
    if(e.propertyName!=='height') return;
    body.removeEventListener('transitionend',done);
    if(brief.classList.contains('open')) body.style.height='auto';   // let it reflow freely
  };
  body.addEventListener('transitionend',done);
}
/* The other tab: the box glides to the new tab's own height (measured on the contents,
   not the box, so it can shrink as well as grow) and only the contents take the warp.
   Nothing outside the box is touched. */
let TABIV=null;
function swapTab(brief,body,t){
  const inner=body.querySelector('.binner');
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  clearTimeout(body._sw);
  const h0=body.offsetHeight;
  brief.dataset.t=t;
  if(reduce){ body.style.height='auto'; return; }
  const h1=inner.offsetHeight;
  body.classList.add('anim');
  body.style.height=h0+'px'; void body.offsetHeight;
  body.style.height=h1+'px';
  body._sw=setTimeout(()=>{ if(brief.classList.contains('open')) body.style.height='auto'; },380);
  if(ios()){ inner.classList.remove('fade'); void inner.offsetWidth; inner.classList.add('fade'); return; }
  document.querySelectorAll('.binner.warp').forEach(x=>x.classList.remove('warp'));
  if(TABIV){ clearInterval(TABIV); TABIV=null; }
  const F=[[30,'0.006 0.20'],[9,'0.002 0.07'],[22,'0.008 0.26'],[5,'0.001 0.04'],[13,'0.005 0.17'],[3,'0.002 0.09'],[0,'0.002 0.09']];
  const disp=document.getElementById('tabwarpDisp'), noise=document.getElementById('tabwarpNoise');
  let i=0;
  const step=()=>{
    const f=F[i++];
    if(!f){ clearInterval(TABIV); TABIV=null; inner.classList.remove('warp'); return; }
    if(disp) disp.setAttribute('scale',f[0]);
    if(noise){ noise.setAttribute('baseFrequency',f[1]); noise.setAttribute('seed',Math.floor(RND(1,90))); }
  };
  inner.classList.add('warp'); step();
  TABIV=setInterval(step,45);
}
document.addEventListener('click',e=>{
  const b=e.target && e.target.closest && e.target.closest('.bsum');
  if(b) openBrief(b.dataset.br,b.dataset.t);
},false);

/* Interference on the live row: random gaps, only while a session is running and
   nothing is covering the screen. */
let ZAPT=0;
function zapLoop(){
  clearTimeout(ZAPT);
  ZAPT=setTimeout(()=>{
    const row=document.querySelector('.setbtn.now');
    const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(row && T.start && !reduce && !ios() && !document.querySelector('.sheet') && !document.hidden){
      row.classList.remove('zap'); void row.offsetWidth; row.classList.add('zap');
      setTimeout(()=>{ row.classList.remove('zap'); },430);
    }
    zapLoop();
  }, 4500+Math.random()*7000);
}
function go(){ rTrain(); paintFab(); syncMusic(); scrTo(0); }
document.getElementById('fab').onclick=fabTap;
document.getElementById('imFile').onchange=e=>{
  const f=e.target.files[0]; if(f) f.text().then(t=>{ if(importText(t)) reopenSync(); });
  e.target.value='';
};
/* Sync on the way out, and again on the way back in. */
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ ghFlush(); return; }
  if(ghOn()) ghSync();
});
/* Anything you can press should answer. Handlers that play their own cue run first
   and mark the time, so this only fills in the gaps — and scrolling never triggers
   it, because a scroll is not a click. */
document.addEventListener('click',e=>{
  const t=e.target && e.target.closest &&
    e.target.closest('button,a[href],summary,select,label,.setbtn,.veil');
  if(!t) return;
  if(Date.now()-SFXAT<150) return;      // a richer cue already answered this press
  sfx('tap');
},false);
document.addEventListener('change',e=>{
  if(e.target && e.target.tagName==='SELECT' && Date.now()-SFXAT>=150) sfx('tap');
},false);
document.getElementById('cog').onclick=openSettings;
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(DB.theme==='auto') applyTheme('auto'); });
document.getElementById('mus').onclick=()=>openMusic('header');
document.getElementById('musPP').onclick=()=>{ PL.on?mPause():mResume(); };
/* Hands the link to YouTube rather than trying to play it here: an embedded player
   stops the moment the screen locks, which is most of a session.
   It has to be a real link with a real href — iOS only routes a tap to the app when
   it is a genuine link tap. Opening it from script lands in a browser tab instead. */
function syncMusic(){ paintMusic(); }
/* The interface is hidden until the splash is dismissed, so anything that throws on
   the way up would leave a blank screen. Each step is isolated, and a watchdog
   uncovers the app regardless after a few seconds. */
const boot=(name,fn)=>{ try{ fn(); }catch(e){ console.error('start-up: '+name, e); } };
setTimeout(()=>{
  const r=document.documentElement;
  if(r.classList.contains('booting')){
    booted();                                      // never stay blank
    const sp=document.getElementById('splash');
    if(sp && !document.getElementById('spGo')) sp.remove();
  }
},7000);
boot('load',load);
boot('render',go);
boot('sheets',watchSheets);
boot('splash',splash);
boot('music',mPreselect);
boot('interference',()=>{ zapLoop(); setTimeout(rollPass, RND(1500,9000)); drawStatic(); fuzzNext(); });
boot('worker',()=>{ if(HOSTED && 'serviceWorker' in navigator)
  navigator.serviceWorker.register('sw.js').catch(()=>{}); });
boot('tick',runTick);
boot('sync',()=>{ refreshCog(); if(ghOn()) ghSync(); });
boot('restore',()=>{
  if(!DB.seen && !DB.sess.length) setTimeout(openRestore,500);
  else if(STORE==='memory') setTimeout(()=>toast('Not saving \u2014 export before closing'),600);
});
</script>
