<script>
/* ---------- storage: localStorage, memory fallback ---------- */
const KEY='sfx_log_v1';
let DB={sess:[],wt:[]}, mem={}, STORE='memory';
const APP_VERSION='2026.09.22.75';
const HOSTED = location.protocol==='https:';
const STORE_LABEL={
  local: HOSTED
    ? 'Saved to this site on this device. It survives app updates and closing the app. Clearing Safari data for this site wipes it.'
    : 'Saved in this browser only, and tied to how this file was opened. Copy the backup often.',
  memory:'Not saving — this browser is blocking storage. Anything you log is lost on reload.'
};
function load(){
  try{ localStorage.setItem(KEY+'_t','1'); localStorage.removeItem(KEY+'_t'); STORE='local'; }catch(e){ STORE='memory'; }
  try{
    const s = STORE==='local' ? localStorage.getItem(KEY) : mem[KEY];
    if(s) DB=JSON.parse(s);
  }catch(e){}
  if(!Array.isArray(DB.wt)) DB.wt=[];
  if(!Array.isArray(DB.waist)) DB.waist=[];
  if(!Array.isArray(DB.photos)) DB.photos=[];
  if(!Array.isArray(DB.sess)) DB.sess=[];
  if(typeof DB.bk!=='number') DB.bk=0;
  if(typeof DB.seen!=='boolean') DB.seen=false;
}
function save(){
  LEDGER=null;                              // the log moved; the score is stale
  const s=JSON.stringify(DB); mem[KEY]=s;
  if(STORE!=='local') return false;
  try{ localStorage.setItem(KEY,s); return true; }
  catch(e){ toast('Save failed — export a backup now'); return false; }
}
const today=()=>new Date().toISOString().slice(0,10);
const daysAgo=s=>Math.round((new Date(today())-new Date(s))/864e5);

/* ---------- program ---------- */
const EX={
 gsq:{rest:90,n:'Goblet squat',s:3,lo:8,hi:12,inc:2.5,lop:1,mus:'Quads · Glutes',sec:'core, upper back, adductors',how:'Hold one dumbbell vertically against your chest, elbows tucked under it. Feet shoulder-width, toes turned out slightly. Sit straight down until your thighs are at least parallel to the floor, chest tall the whole way. Drive up through your mid-foot.',cue:'If your heels lift, put your toes out wider.'},
 bp:{rest:90,n:'Dumbbell bench press',s:3,lo:6,hi:10,inc:2,mus:'Chest · Triceps',sec:'front delts',how:'Lie flat on the bench, dumbbells at chest height just outside your ribs. Press up and slightly together until your arms are straight. Lower under control for 2 seconds until you feel a stretch across your chest.',cue:'Keep your shoulder blades pinned back and down into the bench.'},
 row:{rest:60,n:'One-arm row',s:3,side:1,lo:8,hi:12,inc:2,mus:'Lats · Mid-back',sec:'biceps, rear delts, forearms',how:'One hand and one knee on the bench, back flat and roughly parallel to the floor. Other hand holds the dumbbell hanging straight down. Pull it to your hip, not your shoulder. Lower all the way until your arm is straight.',cue:'3 sets per arm, 6 sets total. Do the weaker arm first, then match that number with the stronger arm. Log the reps from your weaker arm.'},
 pu:{rest:90,n:'Pull-up',s:3,lo:3,hi:8,inc:0,bw:1,vars:['Bodyweight','Resistance band'],mus:'Lats · Biceps',sec:'mid-back, forearms, core',how:'On the power tower. Loop a resistance band under one foot for assistance. Hang with arms straight, pull until your chin clears the bar, lower slowly for 3 seconds.',cue:'Cannot do one yet? Step up to the top and lower yourself as slowly as possible. That builds the strength on its own.'},
 hkr:{rest:45,n:'Hanging knee raise',s:2,lo:10,hi:15,inc:0,bw:1,vars:['Bodyweight',"Captain's chair"],mus:'Lower abs · Hip flexors',sec:'obliques, grip',how:'Hang from the bar, arms straight, no back support. Pull your knees up toward your chest, curling your hips slightly at the top. Lower slowly without swinging, and do not let yourself start rocking.',cue:'You have moved off the captain\'s chair — stay hanging. Log the chair variant only on the nights grip gives out first. This trains your abs; it does not burn belly fat. Nothing does that except eating less.'},
 ht:{rest:90,n:'Hip thrust',s:3,lo:10,hi:15,inc:2.5,mus:'Glutes',sec:'hamstrings, core',how:'Sit on the floor with your upper back against the long edge of the bench, knees bent. Rest a dumbbell across your hips with a folded towel underneath it. Set your feet a little further out than feels natural — far enough that you feel it in your hamstrings and glutes, not your quads. Drive through your heels until your body is a straight line from knees to shoulders, squeeze for one second, then lower.',cue:'Tuck your chin and keep your ribs down. If you feel it in your lower back at the top, you are over-arching — stop lower. Set the dumbbell down on the floor between sets rather than lowering it onto yourself.'},
 ohp:{rest:90,n:'Shoulder press',s:3,lo:6,hi:10,inc:2,mus:'Shoulders · Triceps',sec:'upper chest, core',how:'Sit on the bench with the back upright. Dumbbells at ear height, palms forward. Press straight up until arms lock out. Lower to ear height under control.',cue:'Squeeze your glutes and abs so you do not arch your lower back.'},
 dip:{rest:90,n:'Dip',s:3,lo:6,hi:10,inc:0,bw:1,vars:['Bodyweight'],mus:'Chest · Triceps',sec:'front delts',how:'On the power tower parallel bars. Start with arms locked out, lower until your upper arms are roughly parallel to the floor, press back up. Lean forward slightly to hit more chest.',cue:'Too hard? Do dumbbell floor press instead: same as bench press, lying on the floor.'},
 csr:{rest:60,n:'Chest-supported row',s:3,lo:8,hi:12,inc:2,mus:'Mid-back · Lats',sec:'rear delts, biceps',how:'Set the bench to a 30-45 degree incline. Lie face down on it, chest on the pad, dumbbells hanging. Pull both to your ribs, elbows going backwards not out. Squeeze at the top.',cue:'Your chest stays glued to the bench. No heaving.'},
 lr:{rest:45,n:'Lateral raise',s:2,lo:12,hi:20,inc:0,st:7,
   mus:'Side delts',sec:'traps, rear delts',
   how:'Both dumbbells, standing, slight forward lean. Elbows soft and fixed, raise to shoulder height and no higher. Lead with the elbows, not the hands. Lower slowly — the lowering half is most of the work.',
   cue:'If your traps are shrugging it up, the weight is too heavy. This is the muscle that makes shoulders look wide.'},
 tri:{rest:45,n:'Lying extension',s:2,lo:10,hi:15,inc:0,st:9,
   mus:'Triceps',sec:'long head, elbows',
   how:'Lie flat on the bench, one dumbbell per hand, arms straight up. Bend at the elbows and lower the bells to the sides of your head, upper arms staying still. Press back up without letting the elbows flare.',
   cue:'Overhead extension does not work with these bells \u2014 too bulky to clear the head. Lying to the sides of the head loads the long head at a longer length anyway. If the elbows complain, swap to bench dips: hands on the bench behind you, heels out.'},
 cur:{rest:45,n:'Dumbbell curl',s:2,lo:10,hi:15,inc:0,st:9,
   mus:'Biceps',sec:'brachialis, forearms',
   how:'Both dumbbells, standing. Elbows pinned to your ribs. No swinging, no leaning back. Straighten your arms fully at the bottom of every rep.',
   cue:'Stopping short at the bottom is the usual way this exercise gets wasted. Full extension, controlled down.'},
 spl:{rest:60,n:'Split squat',s:2,side:1,lo:8,hi:12,inc:2,mus:'Quads · Glutes',sec:'hamstrings, adductors, balance',how:'One foot forward, one foot back about a metre, dumbbells at your sides. Lower straight down until your back knee nearly touches the floor. Push up through your front heel.',cue:'2 sets per leg, 4 sets total. Weaker leg first, then match it. Log the reps from your weaker leg. Hold something for balance at first — carpet is kind to your back knee here.'}
};
/* FitnessLAB 40kg dumbbells. Dial positions per dumbbell (both sides matched):
   5 7 9 11 13 15 18 20 22 25 27 29 32 34 36 38 40.
   Each side carries half, so setting the two sides one position apart lands
   halfway between. Those midpoints are included below. Minimum is 5kg. */
const DIAL=[5,7,9,11,13,15,18,20,22,25,27,29,32,34,36,38,40];
const DBELL=(()=>{
  const out=new Set(DIAL);
  for(let i=0;i<DIAL.length-1;i++) out.add((DIAL[i]+DIAL[i+1])/2);
  return [...out].sort((a,b)=>a-b);
})();
const kgTxt=v=>(Math.round(v*10)/10).toString();
/* Midpoints need the two ends of one dumbbell set a position apart, which leaves
   the bell lopsided. Only the goblet squat uses them — the bell sits vertically against your
   chest, so a lean does not matter. Everything else is balanced only. */
function ladder(id){ return (id && EX[id] && EX[id].lop) ? DBELL : DIAL; }
function snapKg(v,id){
  const L=ladder(id);
  if(!(v>0)) return L[0];
  return L.reduce((a,b)=>Math.abs(b-v)<Math.abs(a-v)?b:a);
}
function nextKg(v,id){
  const L=ladder(id), i=L.indexOf(snapKg(v,id));
  return L[Math.min(L.length-1, i+1)];
}
/* Reps offered: the working range plus headroom either side, so a good night
   or a heavy one is still one tap. */
function setDefaults(id,ix){
  const e=EX[id], d=draft[id][ix], p=prescribe(id);
  const prior=draft[id].slice(0,ix).reverse();
  const lastKg=(prior.find(x=>x.kg!=='' && x.kg!==undefined)||{}).kg;
  const lastReps=(prior.find(x=>x.reps!=='' && x.reps!==undefined)||{}).reps;
  const lastV =(prior.find(x=>x.v)||{}).v;
  return {
    kg:  d.kg!=='' && d.kg!==undefined ? +d.kg
           : snapKg(lastKg!==undefined ? +lastKg : (p.kg || e.st || 0), id),
    v:   d.v || lastV || p.v || (e.vars||['Bodyweight'])[0],
    reps:d.reps!=='' && d.reps!==undefined ? +d.reps : (lastReps!==undefined ? +lastReps : e.hi)
  };
}
function repOpts(e){
  const out=[];                            // starts at 0: a set you could not finish still gets logged
  for(let r=0;r<=e.hi+5;r++) out.push(r);
  return out;
}
/* Ordered so the dumbbells move through the session in one direction as far as
   possible. Supersetting a 30kg squat with a 5kg lateral raise would mean
   re-dialling both bells between every set. Isolation work sits in its own block
   at the light end instead — early enough that it is never the thing dropped. */
/* Pairings are built so nothing in a rest window feeds a heavier lift later in the
   session. Presses go with pulls, never with another press. Laterals sit after all
   the pressing in B, not before it. Pull-ups and knee raises are split so grip is
   not spent between sets, and knee raises land last as the thing to cut when short. */
const W={
 A:{name:'Workout A',ex:['gsq','lr','cur','bp','row','pu','tri','hkr'],
    ss:[['gsq','lr','cur'],['bp','row'],['pu','tri']]},
 B:{name:'Workout B',ex:['ht','cur','ohp','csr','dip','spl','lr'],
    ss:[['ht','cur'],['ohp','csr'],['dip','spl','lr']],
    sets:{cur:3}}
};
/* Set counts are per workout where they differ: curls are 2 in A, 3 in B. */
function setsFor(id,w){ const k=w||pick, o=k&&W[k]&&W[k].sets; return (o&&o[id])||EX[id].s; }
function pairOf(id){ return (W[pick].ss.find(a=>a.indexOf(id)>-1))||null; }
/* 25s between the links of a chain, full rest once the round is finished. The
   exercises in a chain do not all run the same number of sets, so the set that
   closes a round is the last one in the chain that still has a set at that
   index — squats alone on the final round, curls alone on B's last one. */
function restFor(id,ix){
  const g=pairOf(id); if(!g) return EX[id].rest;
  const inRound=g.filter(x=>setsFor(x)>ix);
  return inRound[inRound.length-1]===id
    ? Math.max.apply(null,g.map(x=>EX[x].rest))
    : 25;
}

/* ---------- progression engine ---------- */
function lastFor(id){
  for(let i=DB.sess.length-1;i>=0;i--){const s=DB.sess[i];if(s.sets[id]&&s.sets[id].length)return{s,sets:s.sets[id]}}
  return null;
}
/* What it takes to earn the next weight on a lift. prescribe and the session
   score both read this, so they can never disagree. */
function unlockSpec(id,kg,w){
  const e=EX[id];
  const nxt=e.bw?0:nextKg(kg,id);
  const jump=(!e.bw && nxt>kg)?(nxt-kg)/kg:0;
  /* Epley: to hit e.lo reps at the next weight you need roughly this many at the
     current one. Above about a quarter, no realistic rep count bridges the gap. */
  const bridge=(jump>0 && jump<=0.25)
    ? Math.min(e.hi+8, Math.max(e.hi, Math.ceil(30*((nxt*(1+e.lo/30))/kg-1))))
    : e.hi;
  return {next:nxt, jump:jump, bridge:bridge, need:Math.min(setsFor(id,w), e.s)};
}
/* Did these sets, on their own, earn the increment? */
function metUnlock(id,sets,w){
  const done=(sets||[]).filter(x=>x.reps>0); if(!done.length) return false;
  const kg=Math.max.apply(null,done.map(x=>+x.kg||0));
  const u=unlockSpec(id,kg,w);
  return done.length>=u.need && done.every(x=>x.reps>=u.bridge);
}
function prescribe(id){
  const e=EX[id], L=lastFor(id);
  if(!L) return {kg:e.bw?'':(e.st||''),reps:e.lo,up:false,last:'',
    why: e.bw ? 'As many clean reps as you can.'
      : e.st ? 'New lift. Start at '+kgTxt(e.st)+'kg \u2014 it should feel like you could manage '+(e.hi+2)+'. Adjust from there.'
             : 'Pick a weight you could manage '+(e.hi+2)+' times.'};
  const done=L.sets.filter(x=>x.reps>0);
  const kg=Math.max(...done.map(x=>+x.kg||0));
  /* Epley: to hit e.lo reps at the next weight you need roughly this many at the
     current one. On a 20% jump that is well past the normal top of the range. */
  /* Curls run 2 sets in A and 3 in B, so the bar is the lower of the two. */
  const u=unlockSpec(id,kg), nxt=u.next, jump=u.jump, bridge=u.bridge, need=u.need;
  const top=done.length>=need && done.every(x=>x.reps>=bridge);
  const lastTxt=done.map(x=>({kg:+x.kg||0,reps:+x.reps}));
  lastTxt.v=(done.find(x=>x.v)||{}).v || '';
  if(e.bw){
    const lastV=(done.find(x=>x.v)||{}).v;
    return {kg:'',v:lastV,reps:top?e.hi+1:e.lo,up:top,last:lastTxt,
      why: top?'Add a rep, or less assistance.':'Beat last time by one rep.'};
  }
  if(top){
    const land = jump>0.25 ? Math.max(1,Math.round(30*((kg*(1+e.hi/30))/nxt-1))) : 0;
    return {kg:nxt,reps:e.lo,up:true,last:lastTxt,
      why: land
        ? 'Earned it. '+kgTxt(nxt)+'kg is a '+Math.round(jump*100)+'% step, so expect about '+land+' reps at first — build back to '+e.hi+'.'
        : 'Earned it — all sets hit '+bridge+'.'};
  }
  return {kg:snapKg(kg,id),reps:e.lo,up:false,last:lastTxt,
    why: bridge>e.hi
      ? 'Next step is '+kgTxt(nxt)+'kg, a '+Math.round(jump*100)+'% jump. Build to '+bridge+' reps on all '+need+' sets first.'
      : jump>0.25
        ? 'Add reps to '+e.hi+'. The next step is '+kgTxt(nxt)+'kg — a '+Math.round(jump*100)+'% jump, so expect reps to fall a long way when you take it.'
        : 'Add reps until '+e.hi+' on all '+need+' sets.'};
}
function nextWorkout(){
  for(let i=DB.sess.length-1;i>=0;i--){
    const w=DB.sess[i].w;
    if(w==='A'||w==='B') return w==='A'?'B':'A';   // a dash means we do not know; keep looking
  }
  return 'A';
}
function lastTrained(){
  const s=DB.sess[DB.sess.length-1];
  return s?daysAgo(s.d):null;
}

/* ---------- timer ---------- */
/* ---------- sound ----------
   Original sounds, generated live. Smooth and synthetic rather than lo-fi: pairs of
   slightly detuned sine and triangle oscillators, exponential glides, soft envelopes
   with no hard edges, and a short feedback delay under everything so each cue leaves
   a tail instead of stopping dead. Nothing is clipped, gated or crushed.
   No files, nothing to load, works offline. iOS refuses audio until the screen has
   been touched, so the context is built on the first tap and reused. */
let AC=null, BUS=null;
/* playback while music is running, ambient the rest of the time */
function wantSession(){
  try{
    if(!navigator.audioSession) return;
    const playing = typeof PL!=='undefined' && PL.audio && !PL.audio.paused;
    navigator.audioSession.type = playing ? 'playback' : 'ambient';
  }catch(e){}
}
function acx(){
  if(AC) return AC;
  const C=window.AudioContext||window.webkitAudioContext;
  if(!C) return null;
  /* Ask for the right session before anything makes a sound. Ambient means mix with
     whatever else is playing rather than interrupting it, at the cost of the silent
     switch muting us — right for interface cues. But the tap sound fires on the same
     press as a track, so if it asked for ambient unconditionally it would pull the
     session out from under the music a moment after it started. wantSession decides. */
  wantSession();
  try{ AC=new C(); }catch(e){ return null; }
  const inp=AC.createGain(); inp.gain.value=1;
  /* keep the very bottom out so it stays clean on a phone speaker, and take the
     hardest edge off the top */
  const hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=180;
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=6200; lp.Q.value=0.7;
  /* a short delay with a little feedback: the tail is what makes it read as
     electronic rather than as a beep */
  const dly=AC.createDelay(0.5); dly.delayTime.value=0.085;
  const fb=AC.createGain(); fb.gain.value=0.26;
  const wet=AC.createGain(); wet.gain.value=0.22;
  const out=AC.createGain(); out.gain.value=0.9;
  inp.connect(hp); hp.connect(lp);
  lp.connect(out);
  lp.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(out);
  out.connect(AC.destination);
  BUS=inp;
  return AC;
}
/* A breath of filtered static under each cue: quiet, wide, decaying fast. It is
   what stops the tones sounding like a piano app. */
let NOISE=null;
function noiseBuf(c){
  if(NOISE) return NOISE;
  const len=Math.floor(c.sampleRate*0.6);
  NOISE=c.createBuffer(1,len,c.sampleRate);
  const d=NOISE.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  return NOISE;
}
function hiss(dur,vol,delay,freq){
  const c=acx(); if(!c) return;
  const t0=c.currentTime+(delay||0);
  const src=c.createBufferSource(); src.buffer=noiseBuf(c); src.loop=true;
  const f=c.createBiquadFilter(); f.type='bandpass';
  f.frequency.value=freq||2600; f.Q.value=0.7;
  const g=c.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  src.connect(f); f.connect(g); g.connect(BUS||c.destination);
  src.start(t0); src.stop(t0+dur+0.05);
}
/* One voice: two detuned oscillators, soft in and soft out, optional glide and a
   shallow shimmer. No clicks anywhere — every stage is a ramp. */
function tone(freq,dur,vol,delay,o){
  const c=acx(); if(!c) return;
  o=o||{};
  const t0=c.currentTime+(delay||0);
  const env=c.createGain();
  const det=o.detune===undefined?5:o.detune;
  [0,det].forEach((d,i)=>{
    const osc=c.createOscillator();
    osc.type=o.type||(i?'triangle':'sine');
    osc.frequency.setValueAtTime(freq,t0);
    if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to,t0+dur*(o.bend||0.85));
    osc.detune.value=d;
    osc.connect(env);
    osc.start(t0); osc.stop(t0+dur+0.05);
  });
  const a=o.attack||0.012;
  env.gain.setValueAtTime(0.0001,t0);
  env.gain.exponentialRampToValueAtTime(vol,t0+a);
  env.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  if(o.shimmer){
    const lfo=c.createOscillator(), depth=c.createGain();
    lfo.type='sine'; lfo.frequency.value=o.shimmer;
    depth.gain.value=vol*0.22;
    lfo.connect(depth); depth.connect(env.gain);
    lfo.start(t0); lfo.stop(t0+dur+0.05);
  }
  env.connect(BUS||c.destination);
}
/* A dyad — two notes together read as a chord rather than a beep. */
function dyad(a,b,dur,vol,delay,o){ tone(a,dur,vol,delay,o); tone(b,dur,vol*0.8,delay,o); }
let SFXAT=0;
const HISS={tap:[0.07,0.012],open:[0.13,0.016],close:[0.15,0.013],confirm:[0.2,0.018],
  record:[0.4,0.02],rest:[0.15,0.012],clear:[0.55,0.022],start:[0.6,0.02],
  level:[0.6,0.022],done:[0.7,0.02],nope:[0.28,0.02]};
function sfx(name){
  if(DB.sfx===false) return;
  const c=acx(); if(!c) return;
  if(c.state==='suspended') c.resume();
  SFXAT=Date.now();
  const hs=HISS[name]; if(hs) hiss(hs[0],hs[1],0,name==='rest'?1400:2600);
  switch(name){
    /* moving around: brief, soft, high */
    case 'tap':     tone(2100,0.06,0.05,0,{attack:0.006}); break;
    case 'open':    tone(1046,0.12,0.055,0,{to:1568,bend:0.6}); break;
    case 'close':   tone(1046,0.14,0.045,0,{to:660,bend:0.7}); break;
    /* a set logged: a clean rising fifth */
    case 'confirm': tone(1046,0.09,0.05,0);
                    tone(1568,0.16,0.05,0.055,{shimmer:9}); break;
    case 'record':  tone(1318,0.09,0.05,0);
                    tone(1760,0.09,0.05,0.06);
                    dyad(2093,2637,0.3,0.042,0.12,{shimmer:7}); break;
    case 'rest':    tone(660,0.13,0.035,0,{to:520,bend:0.8}); break;
    /* rest over: three soft pulses climbing, with the delay left ringing */
    case 'clear':   tone(1175,0.13,0.055,0,{shimmer:11});
                    tone(1568,0.13,0.055,0.15,{shimmer:11});
                    dyad(2093,3136,0.34,0.05,0.3,{shimmer:8}); break;
    /* session start: a sweep up into a held dyad */
    case 'start':   tone(392,0.34,0.05,0,{to:1046,bend:0.9,attack:0.03});
                    dyad(1046,1568,0.4,0.04,0.3,{shimmer:6,attack:0.05}); break;
    case 'level':   [1046,1318,1568,2093].forEach((f,i)=>tone(f,i===3?0.42:0.11,0.05,i*0.085,
                      i===3?{shimmer:7}:{}));
                    break;
    case 'done':    dyad(1046,1568,0.16,0.045,0);
                    dyad(1318,1976,0.5,0.045,0.17,{shimmer:6,attack:0.04}); break;
    case 'nope':    tone(440,0.26,0.045,0,{to:196,bend:0.9,type:'triangle'}); break;
  }
}
let T={start:0,restEnd:0,src:'',stamps:[],tick:0,buzzed:false};
const tf=s=>{s=Math.max(0,Math.round(s));const m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0')};
function runTick(){ if(!T.tick) T.tick=setInterval(paintFab,300); paintFab(); }
function startSession(){ if(!T.start){T.start=Date.now(); runTick(); toast('Timer started');} }
function startRest(id,ix){

function nextLabel(){

/* Safari's toolbar slides in and out, so the visible height is not innerHeight. */
function viewH(){ return (window.visualViewport && window.visualViewport.height) || window.innerHeight; }
function fabH(){ const f=document.getElementById('fab'); return (f && !f.classList.contains('hide')) ? f.offsetHeight : 0; }
/* The page must be able to scroll far enough for the LAST set to clear the bar.
   A hard-coded reserve cannot know how tall the bar renders on a given phone, so
   measure it and keep the foot of the page in step. */
let PADH=-1;
function syncPad(force){

/* ---------- music ----------
   Two sources, one list. Tracks committed to the repo are fetched from music/ next
   to the app; tracks imported from the phone are kept in IndexedDB on the device and
   never leave it. Playback flips the audio session to 'playback' so it survives the
   screen locking, and hands it back to 'ambient' when it stops, so the interface
   sounds go back to mixing quietly with anything else. */
const MDB='tl-music', MSTORE='tracks';
function idb(){
  return new Promise((ok,no)=>{
    if(!window.indexedDB) return no(new Error('no indexeddb'));
    const r=indexedDB.open(MDB,1);
    r.onupgradeneeded=()=>{ r.result.createObjectStore(MSTORE,{keyPath:'id'}); };
    r.onsuccess=()=>ok(r.result);
    r.onerror=()=>no(r.error);
  });
}
function idbDo(mode,fn){
  return idb().then(db=>new Promise((ok,no)=>{
    const t=db.transaction(MSTORE,mode), st=t.objectStore(MSTORE);
    const req=fn(st);
    t.oncomplete=()=>ok(req&&req.result);
    t.onerror=()=>no(t.error);
  }));
}
const mAll=()=>idbDo('readonly',st=>st.getAll()).then(r=>r||[]).catch(()=>[]);
/* iOS greys out anything outside an accept list rather than filtering it, and it
   often reports no type at all for a file picked out of Files — so nothing is
   filtered at the picker, and the type is worked out here from the extension. */
const MIME={mp3:'audio/mpeg', m4a:'audio/mp4', aac:'audio/aac', wav:'audio/wav',
            ogg:'audio/ogg', oga:'audio/ogg', opus:'audio/ogg', flac:'audio/flac',
            caf:'audio/x-caf', aiff:'audio/aiff', aif:'audio/aiff', mp4:'audio/mp4'};
function mAdd(file){
  const name=file.name||'track';
  const ext=(name.split('.').pop()||'').toLowerCase();
  const declared=/^audio\//.test(file.type||'');
  /* Accept it if either the file says it is audio or the extension does. Files often
     reports nothing for a track, and it reports the wrong thing for some; what it
     must not do is let a PDF through. */
  if(!declared && !MIME[ext]) return Promise.reject(new Error('not audio'));
  const type=declared ? file.type : MIME[ext];
  /* re-wrap so the stored blob always carries a type the audio element understands */
  const blob=declared ? file : new Blob([file],{type:type});
  return idbDo('readwrite',st=>st.put({
    id:'d'+Date.now()+Math.floor(Math.random()*999),
    name:name.replace(/\.[a-z0-9]+$/i,''), blob:blob, type:type, at:Date.now()}));
}
const mDel=(id)=>idbDo('readwrite',st=>st.delete(id));

let PL={list:[], i:-1, audio:null, on:false, url:''};
/* Tracks committed to the repo, listed in music/index.json. Absent is fine. */
/* Only a successful read is remembered. A failure — offline at start-up, Pages still
   deploying — is left uncached so the next look tries again rather than showing an
   empty list for the rest of the session. */
function repoTracks(){
  if(PL.repo) return Promise.resolve(PL.repo);
  if(typeof fetch!=='function') return Promise.resolve([]);
  return fetch('music/index.json',{cache:'no-store'})
    .then(r=>r.ok?r.json():null)
    .then(j=>{
      if(j===null) return [];                    // no list published, or it failed
      const list=(Array.isArray(j)?j:[]).map(x=>{
        const file=typeof x==='string'?x:(x.file||'');
        if(!file) return null;
        /* encode the name, or a track with a space in it never loads */
        return {id:'r:'+file, src:'music/'+encodeURIComponent(file), repo:true,
                name:(typeof x==='object'&&x.name)||file.replace(/\.[a-z0-9]+$/i,'')};
      }).filter(Boolean);
      PL.repo=list; return list;
    }).catch(()=>[]);
}
function mList(){
  return Promise.all([repoTracks(), mAll()]).then(([r,d])=>
    r.concat(d.map(x=>({id:x.id, blob:x.blob, name:x.name, repo:false}))));
}
function mAudio(){
  if(PL.audio) return PL.audio;
  const a=new Audio();
  a.preload='none';
  a.addEventListener('ended',()=>mPlay(PL.i+1));
  a.addEventListener('play',()=>{ PL.on=true; paintMusic(); });
  a.addEventListener('pause',()=>{ PL.on=false; wantSession(); paintMusic(); });
  a.addEventListener('error',()=>{
    const t=PL.list[PL.i];
    if(t && !t.repo && !t.tried) return;        // the retry will handle it
    PL.on=false; paintMusic();
    toast(t && t.repo ? 'TRACK MISSING FROM THE REPO' : 'TRACK WILL NOT LOAD');
  });
  PL.audio=a;
  return a;
}
function mSession(t){
  if(!navigator.mediaSession) return;
  try{
    navigator.mediaSession.metadata=new MediaMetadata({title:t.name, artist:'Training Log'});
    navigator.mediaSession.setActionHandler('play',()=>mResume());
    navigator.mediaSession.setActionHandler('pause',()=>mPause());
    navigator.mediaSession.setActionHandler('nexttrack',()=>mPlay(PL.i+1));
    navigator.mediaSession.setActionHandler('previoustrack',()=>mPlay(PL.i-1));
  }catch(e){}
}
/* A blob: URL is refused by the media element when the page has an opaque origin —
   inside a sandboxed frame, for instance. A data: URL is not, so it is the fallback.
   It costs memory (a third more than the file) but it plays. */
function blobData(b){
  return new Promise((ok,no)=>{
    const r=new FileReader();
    r.onload=()=>ok(r.result);
    r.onerror=()=>no(r.error||new Error('read failed'));
    r.readAsDataURL(b);
  });
}
function mSrcFor(t){
  return t.blob.type ? t.blob : new Blob([t.blob],{type:t.type||'audio/mpeg'});
}
function mPlay(i){
  const list=PL.list;
  if(!list.length) return;
  if(i<0) i=list.length-1;
  if(i>=list.length) i=0;
  const t=list[i], a=mAudio();
  DB.trk=t.id; save();                 // remember it for next time
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}   // before play, or the lock screen stops it
  if(PL.url){ URL.revokeObjectURL(PL.url); PL.url=''; }
  a.src = t.repo ? t.src : (PL.url=URL.createObjectURL(mSrcFor(t)));
  PL.i=i;
  /* Do not wait on the play event alone — set the state when the call resolves, and
     let pause and ended correct it. */
  a.play().then(()=>{ PL.on=true; paintMusic(); })
          .catch(e=>{
            const n=(e&&e.name)||'';
            /* One retry through a data: URL before giving up — this is the case where
               the page cannot use blob URLs at all. */
            if(n==='NotSupportedError' && !t.repo && !t.tried){
              t.tried=true;
              toast('RETRYING');
              return blobData(mSrcFor(t)).then(d=>{
                if(PL.url){ URL.revokeObjectURL(PL.url); PL.url=''; }
                a.src=d;
                return a.play().then(()=>{ PL.on=true; paintMusic(); });
              }).catch(()=>{ PL.on=false; paintMusic(); toast('THIS FILE WILL NOT PLAY HERE'); });
            }
            PL.on=false; paintMusic();
            toast(n==='NotAllowedError' ? 'TAP PLAY AGAIN TO START'
                : n==='NotSupportedError' ? 'THIS FORMAT WILL NOT PLAY'
                : 'CANNOT PLAY: '+(n||'ERROR'));
          });
  mSession(t);
  paintMusic();
}
function mPause(){ if(PL.audio) PL.audio.pause(); }
function mResume(){
  if(PL.i<0) return mPlay(0);
  if(!PL.audio || !PL.audio.src) return mPlay(PL.i);   // selected at start-up, never loaded
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
  PL.audio.play().then(()=>{ PL.on=true; paintMusic(); })
    .catch(e=>toast('CANNOT PLAY: '+((e&&e.name)||'ERROR')));
}
function mStop(){
  if(PL.audio){ PL.audio.pause(); PL.audio.removeAttribute('src'); PL.audio.load(); }
  if(PL.url){ URL.revokeObjectURL(PL.url); PL.url=''; }
  PL.i=-1; PL.on=false;
  wantSession();                       // hand the session back
  paintMusic();
}

/* ---------- GitHub sync ----------
   Commits the TL1 backup straight to the repo through the contents API. The token
   lives in this browser's storage and never goes into the file itself — the file is
   public on Pages, the token must not be. Owner and repo are read off the Pages URL,
   so there is nothing to type but the token. */
const GH_API='https://api.github.com';
function ghGuess(){
  const host=(location.hostname||'').toLowerCase();
  const owner=/\.github\.io$/.test(host) ? host.replace('.github.io','') : '';
  const seg=(location.pathname||'/').split('/').filter(Boolean);
  /* user.github.io/repo/... is a project page; user.github.io/... is the user page,
     whose repo is named after the host. */
  const repo=seg.length && !/\.html?$/i.test(seg[0]) ? seg[0] : (owner?owner+'.github.io':'');
  return {owner:owner, repo:repo};
}
function ghCfg(){
  const g=DB.gh||{}, guess=ghGuess();
  return {tok:g.tok||'', owner:g.owner||guess.owner, repo:g.repo||guess.repo,
          path:g.path||'backup/training-log.txt', branch:g.branch||'main',
          sha:g.sha||'', at:g.at||0, err:g.err||''};
}
function ghSave(patch){ DB.gh=Object.assign(ghCfg(),patch); save(); }
function ghOn(){ const c=ghCfg(); return !!(c.tok && c.owner && c.repo); }
function b64(text){ return btoa(unescape(encodeURIComponent(text))); }
async function ghReq(path,opt){
  const c=ghCfg();
  const r=await fetch(GH_API+path, Object.assign({
    headers:{Authorization:'Bearer '+c.tok, Accept:'application/vnd.github+json',
             'X-GitHub-Api-Version':'2022-11-28'}
  },opt||{}));
  return r;
}
/* Push the current log. Returns a short status string. */
async function ghPush(quiet){
  const c=ghCfg();
  if(!ghOn()) return 'not set up';
  const body=(sha)=>JSON.stringify({
    message:'log: '+DB.sess.length+' sessions',
    content:b64(packDB()), branch:c.branch, sha:sha||undefined});
  const url='/repos/'+c.owner+'/'+c.repo+'/contents/'+c.path;
  try{
    let r=await ghReq(url,{method:'PUT',body:body(c.sha)});
    if(r.status===409||r.status===422){
      /* someone or something else moved the file: take the current sha and redo */
      const g=await ghReq(url+'?ref='+encodeURIComponent(c.branch));
      const j=g.ok?await g.json():null;
      r=await ghReq(url,{method:'PUT',body:body(j&&j.sha)});
    }
    if(!r.ok){
      const msg=r.status===401?'bad token':r.status===404?'repo or path not found':'error '+r.status;
      ghSave({err:msg});
      if(!quiet) toast('SYNC: '+msg.toUpperCase());
      return msg;
    }
    const j=await r.json();
    ghSave({sha:(j.content&&j.content.sha)||'', at:Date.now(), err:''});
    markBacked();
    if(!quiet) toast('SYNCED TO GITHUB');
    return 'ok';
  }catch(e){
    ghSave({err:'offline'});
    if(!quiet) toast('SYNC: NO CONNECTION');
    return 'offline';
  }
}
/* Paste a token, check it can see the repo, store it. */
async function ghConnect(){
  if(!(navigator.clipboard && navigator.clipboard.readText)) return toast('CLIPBOARD BLOCKED');
  let t='';
  try{ t=(await navigator.clipboard.readText()||'').trim(); }catch(e){ return toast('CLIPBOARD BLOCKED'); }
  if(!/^(gh[pousr]_|github_pat_)/.test(t)) return toast('NOT A GITHUB TOKEN');
  const guess=ghGuess();
  if(!guess.owner || !guess.repo) return toast('OPEN THE APP FROM ITS PAGES URL');
  ghSave({tok:t, owner:guess.owner, repo:guess.repo, sha:'', err:''});
  const r=await ghReq('/repos/'+guess.owner+'/'+guess.repo);
  if(!r.ok){ ghSave({tok:'', err:'token rejected'}); return toast('TOKEN REJECTED'); }
  toast('CONNECTED');
  await ghPush();
  openBackup();
}
function ghWhen(){
  const c=ghCfg();
  if(!c.tok) return 'not connected';
  if(c.err) return c.err;
  if(!c.at) return 'connected, nothing sent yet';
  const mins=Math.round((Date.now()-c.at)/60000);
  return mins<1?'synced just now':mins<60?'synced '+mins+'m ago':'synced '+Math.round(mins/60)+'h ago';
}
/* Backup format TL1 — plain text, one line per session.
   260824 A gsq 20x10,20x10,20x12 | bp 10x8,10x8
   Weighted sets are kg x reps; bodyweight sets are variant-index x reps. */
const d6=v=>v.slice(2,4)+v.slice(5,7)+v.slice(8,10);
const d10=v=>'20'+v.slice(0,2)+'-'+v.slice(2,4)+'-'+v.slice(4,6);
function packDB(){
  const out=['TL1'];
  DB.sess.forEach(x=>{
    const parts=Object.keys(x.sets).map(id=>{
      const e=EX[id]; if(!e) return '';
      const vs=e.vars||[];
      return id+' '+x.sets[id].map(r=> e.bw
        ? Math.max(0,vs.indexOf(r.v))+'x'+r.reps
        : kgTxt(r.kg)+'x'+r.reps).join(',');
    }).filter(Boolean);
    out.push(parts.length ? d6(x.d)+' '+x.w+' '+parts.join(' | ')
                          : d6(x.d)+' '+(/^[AB]$/.test(x.w)?x.w:'-'));
  });
  if(DB.wt.length)     out.push('W '+DB.wt.map(x=>d6(x.d)+' '+x.kg).join(' | '));
  if(DB.waist.length)  out.push('M '+DB.waist.map(x=>d6(x.d)+' '+x.cm).join(' | '));
  if(DB.photos.length) out.push('P '+DB.photos.map(x=>d6(x.d)).join(' '));
  return out.join('\n');
}
function unpackDB(txt){
  const out={sess:[],wt:[],waist:[],photos:[]};
  txt.split(/\r?\n/).forEach(line=>{
    line=line.trim();
    if(!line || line==='TL1') return;
    if(line[0]==='W' || line[0]==='M'){
      line.slice(1).split('|').forEach(part=>{
        const t=part.trim().split(/\s+/); if(t.length<2 || !/^\d{6}$/.test(t[0])) return;
        if(line[0]==='W') out.wt.push({d:d10(t[0]), kg:+t[1]});
        else out.waist.push({d:d10(t[0]), cm:+t[1]});
      });
      return;
    }
    if(line.slice(0,2)==='Y ') return;    // a link from an older version; no longer used
    if(line[0]==='P'){
      line.slice(1).trim().split(/\s+/).forEach(t=>{ if(/^\d{6}$/.test(t)) out.photos.push({d:d10(t)}); });
      return;
    }
    /* A session logged before this app existed: date, workout letter (or a dash if
       it is not known), and nothing after it. It happened; there is just no detail. */
    const bare=line.match(/^(\d{6})\s+([AB-])$/);
    if(bare){ out.sess.push({d:d10(bare[1]), w:bare[2], sets:{}}); return; }
    const m=line.match(/^(\d{6})\s+(\S+)\s+(.*)$/); if(!m) return;
    const sets={};
    m[3].split('|').forEach(chunk=>{
      const t=chunk.trim().split(/\s+/), id=t[0];
      if(!EX[id] || !t[1]) return;
      const e=EX[id], vs=e.vars||['Bodyweight'];
      const v=t.slice(1).join('').split(',').filter(Boolean).map(pair=>{
        const q=pair.split('x');
        return e.bw ? {kg:0, reps:+q[1], v:vs[+q[0]]||vs[0]} : {kg:+q[0], reps:+q[1]};
      });
      if(v.length) sets[id]=v;
    });
    out.sess.push({d:d10(m[1]), w:m[2], sets:sets});
  });
  return out;
}
function esc(v){
  return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
/* Anything arriving from an imported backup is untrusted. Coerce it to the shapes
   the app expects and drop the rest, rather than trusting what was pasted in. */
const DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
function num(v,lo,hi){ const n=+v; return Number.isFinite(n) && n>=lo && n<=hi ? n : null; }
function cleanDB(d){
  const out={sess:[],wt:[],waist:[],photos:[],sfx:true,bk:0,seen:true};
  /* carried through untouched, or reloading the app would forget the GitHub token */
  if(d && d.gh && typeof d.gh==='object') out.gh=d.gh;
  if(d && typeof d.trk==='string') out.trk=d.trk;
  out.sfx = !(d && d.sfx===false);
  if(!d || typeof d!=='object') return out;
  (Array.isArray(d.wt)?d.wt:[]).forEach(x=>{
    if(!x || !DATE_RE.test(x.d)) return;
    const kg=num(x.kg,20,400); if(kg===null) return;
    out.wt.push({d:x.d, kg:kg});
  });
  out.wt.sort((a,b)=>a.d<b.d?-1:1);
  (Array.isArray(d.waist)?d.waist:[]).forEach(x=>{
    if(!x || !DATE_RE.test(x.d)) return;
    const cm=num(x.cm,30,250); if(cm===null) return;
    out.waist.push({d:x.d, cm:cm});
  });
  out.waist.sort((a,b)=>a.d<b.d?-1:1);
  (Array.isArray(d.photos)?d.photos:[]).forEach(x=>{
    if(x && DATE_RE.test(x.d)) out.photos.push({d:x.d});
  });
  out.photos.sort((a,b)=>a.d<b.d?-1:1);
  (Array.isArray(d.sess)?d.sess:[]).forEach(x=>{
    if(!x || !DATE_RE.test(x.d)) return;
    const known=!!W[x.w];
    const sets={};
    Object.keys(x.sets||{}).forEach(id=>{
      if(!EX[id] || !Array.isArray(x.sets[id])) return;
      const v=x.sets[id].map(r=>{
        const o={kg:num(r&&r.kg,0,500), reps:num(r&&r.reps,0,999)};
        const vs=EX[id].vars||[];
        if(r && vs.indexOf(r.v)>-1) o.v=r.v;
        return o;
      }).filter(r=>r.kg!==null && r.reps!==null);
      if(v.length) sets[id]=v;
    });
    /* A session with no sets is one that was backfilled from elsewhere — it is kept,
       with a dash where the workout letter would be if we do not know it. A session
       with sets but an unrecognised workout is corrupt, and is dropped. */
    if(!known && Object.keys(sets).length) return;
    out.sess.push({d:x.d, w:known?x.w:'-', sets:sets});
  });
  out.sess.sort((a,b)=>a.d<b.d?-1:1);
  out.bk=out.sess.length;
  return out;
}
function copyBox(t){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(t.value).then(()=>{ markBacked(); toast('COPIED'); })
      .catch(()=>{ if(legacyCopy(t)) toast('COPIED'); else toast('SELECT AND COPY'); });
    return true;
  }
  return legacyCopy(t);
}
function legacyCopy(t){
  const ro=t.readOnly;
  t.readOnly=false;                       // iOS will not select a readonly field
  const r=document.createRange(); r.selectNodeContents(t);
  const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  t.setSelectionRange(0,999999);
  let ok=false;
  try{ ok=document.execCommand('copy'); }catch(e){}
  t.readOnly=ro;
  if(ok) markBacked();
  return ok;
}

/* ---------- timeline ---------- */
const PLAN={total:72,perWeek:3};
const MILES=[
 {n:6, t:'Form settled on both workouts', p:'<b>80%</b> are still going at two weeks. The easy part.'},
 {n:15,t:'Every lift has gone up once',   p:'<b>65%</b> last five weeks. Month one is where most quit.'},
 {n:27,t:'Waist easing, scale flat',      p:'<b>50%</b> still going at month three. The field thins here.'},
 {n:42,t:'Arms thicker, posture holding', p:'<b>40%</b> make fourteen weeks. By then it is habit.'},
 {n:60,t:'Visibly built at 75kg',         p:'<b>33%</b> reach five months. You would be in the top third.'},
 {n:72,t:'Six months done',               p:'<b>30%</b> finish six months. Most who start never see this.'}

function pace(){
  const n=DB.sess.length;
  if(n<6) return PLAN.perWeek;
  // lifetime average alone never forgets a bad month, so blend it with a recent window
  const lifetime = Math.max(0.5, n/Math.max(1, daysAgo(DB.sess[0].d)/7));
  const k = Math.min(8,n), span = daysAgo(DB.sess[n-k].d) - daysAgo(DB.sess[n-1].d);
  let recent = lifetime;
  if(span > 0){
    const gap = span/(k-1), stale = daysAgo(DB.sess[n-1].d);
    // rest days you normally take are not slippage; only the excess counts against you
    recent = (k-1)/((span + Math.max(0, stale-gap))/7);
  }
  return Math.max(1, Math.min(7, 0.5*recent + 0.5*lifetime));
}
function stale(){ return DB.sess.length ? daysAgo(DB.sess[DB.sess.length-1].d) : 0; }
function etaFor(target){
  if(stale() > 21) return 'paused';        // no honest date after a layoff this long
  const left=Math.max(0,target-DB.sess.length);
  const d=new Date(); d.setDate(d.getDate()+Math.round(left/pace()*7));
  return d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'2-digit'});
}
function nextMile(){ return MILES.find(m=>m.n>DB.sess.length)||null; }

/* ---------- clearance ----------
   XP is never stored. It is recomputed from the session log every time, so it
   survives a TL1 import and can never drift from what was actually trained.

   Nothing scales with raw reps. Grinding set 1 to failure earns the same 10 as a
   paced one, and then costs the HELD bonus and the quality points on sets 2 and 3
   — so the scoring pushes the same way the program does. */
const XP={set:10,quality:5,top:8,held:20,record:35,unlock:120,full:60,ontime:25,week:150};
const RANKS=[[0,'RECRUIT'],[5,'OPERATIVE'],[10,'AGENT'],[15,'SPECIALIST'],
             [20,'VETERAN'],[25,'ELITE'],[30,'HOUND'],[35,'GRAY FOX'],
             [40,'FOX'],[45,'FOXHOUND'],[50,'BIG BOSS']];
function rankOf(l){ let r=RANKS[0][1]; RANKS.forEach(x=>{ if(l>=x[0]) r=x[1]; }); return r; }
/* Cheap early levels, then a flat ceiling. Letting the cost climb forever turns
   the back half into a grind; the ceiling holds a rank at roughly a month. */
function xpNeed(l){ return Math.min(1900, 450+80*l); }
function levelOf(xp){
  let l=0, rem=Math.max(0,Math.round(xp));
  while(rem>=xpNeed(l)){ rem-=xpNeed(l); l++; }
  return {lvl:l, into:rem, need:xpNeed(l), rank:rankOf(l)};
}
function plannedSets(w){
  if(!W[w]) return 0;
  const seen={}; let n=0;
  W[w].ex.forEach(id=>{ if(seen[id])return; seen[id]=1; n+=setsFor(id,w); });
  return n;
}
/* Monday of the week a date falls in, as YYYY-MM-DD. */
function weekKey(d){
  const t=new Date(d+'T00:00:00');
  t.setDate(t.getDate()-((t.getDay()+6)%7));
  return t.toISOString().slice(0,10);
}
/* A lift's best ever: the heaviest it has been done, and the most reps at that
   weight. Bodyweight lifts are judged on total reps instead. */
function blankBest(){ return {kg:0,reps:0,tot:0}; }
function setsPeak(id,sets){
  const e=EX[id], done=(sets||[]).filter(x=>x.reps>0);
  if(!done.length) return null;
  const kg=Math.max.apply(null,done.map(x=>+x.kg||0));
  return {kg:kg,
          reps:Math.max.apply(null,done.filter(x=>(+x.kg||0)===kg).map(x=>x.reps)),
          tot:done.reduce((a,x)=>a+x.reps,0)};
}
function beatsBest(id,peak,best){
  if(!peak || !best) return false;        // nothing to beat the first time out
  return EX[id].bw ? peak.tot>best.tot
                   : (peak.kg>best.kg || (peak.kg===best.kg && peak.reps>best.reps));
}
function mergeBest(id,best,peak){
  const b=best||blankBest();
  if(!peak) return b;
  if(EX[id].bw) return {kg:0,reps:0,tot:Math.max(b.tot,peak.tot)};
  if(peak.kg>b.kg) return {kg:peak.kg,reps:peak.reps,tot:0};
  if(peak.kg===b.kg) return {kg:b.kg,reps:Math.max(b.reps,peak.reps),tot:0};
  return b;
}
/* One session's score. Nothing scales with raw reps: pacing pays, grinding set 1
   does not. prev holds every lift's best before this session, weeks how many
   sessions the week already had. */
function xpForSession(s,prev,gap,weekN,paid){
  /* Backfilled sessions have no sets to score. They still count as sessions — for
     the tally, the week and the streak — but they earn nothing and take no grade. */
  if(!s.sets || !Object.keys(s.sets).length)
    return {total:0, lines:[], sets:0, planned:0, grade:'\u2014', score:0,
            recs:0, unlocks:0, week:false, won:[], bare:true};
  let sets=0,qual=0,tops=0,held=0,holdable=0,recs=0,unl=0;
  const won=[];
  for(const id in s.sets){
    const e=EX[id]; if(!e) continue;
    const v=s.sets[id].filter(x=>x.reps>0); if(!v.length) continue;
    sets+=v.length;
    v.forEach(x=>{ if(x.reps>=e.lo) qual++; if(x.reps>=e.hi) tops++; });
    if(v.length>=2){ holdable++; if(v.every(x=>x.reps>=v[0].reps-1)) held++; }
    const peak=setsPeak(id,v), rec=beatsBest(id,peak,prev[id]);
    if(rec) recs++;
    /* An unlock pays once per weight. Stalling at a weight you have already
       cleared earns nothing; bodyweight lifts have to beat their own record. */
    if(metUnlock(id,v,s.w) && (e.bw ? rec : peak.kg > ((paid&&paid[id])!=null?paid[id]:-1))){
      unl++; won.push([id,e.bw?0:peak.kg]);
    }
  }
  const planned=plannedSets(s.w), full=planned>0 && sets>=planned;
  const ontime=(gap===null||gap<=3), week=(weekN===3);
  const L=[];
  if(sets) L.push([sets+' sets logged', sets*XP.set]);
  if(qual) L.push([qual+' in range', qual*XP.quality]);
  if(tops) L.push([tops+' at the top', tops*XP.top]);
  if(held) L.push([held+' held across sets', held*XP.held]);
  if(recs) L.push([recs+' new record'+(recs===1?'':'s'), recs*XP.record]);
  if(unl)  L.push([unl+' weight unlocked', unl*XP.unlock]);
  if(full) L.push(['Full session', XP.full]);
  if(ontime) L.push(['On schedule', XP.ontime]);
  if(week) L.push(['Third session this week', XP.week]);
  /* Grade: finishing the session, holding sets flat, and keeping reps in range.
     Records and unlocks lift it, but cannot rescue a session left unfinished. */
  const doneR=planned?Math.min(1,sets/planned):0;
  const heldR=holdable?held/holdable:1;
  const qualR=sets?qual/sets:0;
  const score=Math.min(100, 60*doneR + 25*heldR + 15*qualR + (recs?3:0) + (unl?4:0));
  /* S needs the whole session on the board. Nothing else can buy it. */
  const ceiling = doneR>=1 ? 'S' : doneR>=0.85 ? 'A' : doneR>=0.65 ? 'B' : 'C';
  const raw=score>=93?'S':score>=82?'A':score>=68?'B':'C';
  const order='CBAS';
  const grade=order[Math.min(order.indexOf(raw),order.indexOf(ceiling))];
  return {total:L.reduce((a,x)=>a+x[1],0), lines:L, sets:sets, planned:planned,
          grade:grade, score:Math.round(score), recs:recs, unlocks:unl, week:week, won:won};
}
/* The ledger walks every session, so it is computed once and held until the log
   changes. Everything during a session then only scores the draft in front of it. */
let LEDGER=null;
function ledger(){
  /* Recompute when the log is replaced (import) or grows (save), not otherwise. */
  if(!LEDGER || LEDGER.src!==DB.sess || LEDGER.n!==DB.sess.length){
    LEDGER=xpLedger(); LEDGER.src=DB.sess; LEDGER.n=DB.sess.length;
  }
  return LEDGER;
}
function xpLedger(){
  const best={}, weeks={}, paid={}; let total=0; const per=[];
  DB.sess.forEach((s,i)=>{
    const gap = i ? Math.max(0, daysAgo(DB.sess[i-1].d)-daysAgo(s.d)) : null;
    const wk=weekKey(s.d); weeks[wk]=(weeks[wk]||0)+1;
    const r=xpForSession(s,best,gap,weeks[wk],paid);
    total+=r.total; per.push(r);
    r.won.forEach(x=>{ paid[x[0]]=Math.max(paid[x[0]]||0,x[1]); });
    for(const id in s.sets) if(EX[id]) best[id]=mergeBest(id,best[id],setsPeak(id,s.sets[id]));

/* Consecutive weeks of three sessions, counting back. This week only breaks the
   run once it is over, so a Monday never looks like a failure. */
function streakFrom(weeks){
  const wk=k=>weeks[k.toISOString().slice(0,10)]||0;
  let k=new Date(weekKey(today())+'T00:00:00'), n=0;
  if(wk(k)>=3) n++;                       // this week, once it is already done
  k.setDate(k.getDate()-7);
  while(wk(k)>=3 && n<520){ n++; k.setDate(k.getDate()-7); }
  return n;
}
/* The half-finished session in front of you, scored as if you stopped now. */
function draftSets(){
  const out={};
  for(const id in draft){
    const v=draft[id].filter(x=>x.tk && +x.reps>0).map(x=>({kg:+x.kg||0,reps:+x.reps,v:x.v}));
    if(v.length) out[id]=v;
  }

}
function xpLive(){
  const l=ledger();
  const sets=draftSets();
  if(!Object.keys(sets).length) return {base:l.total, live:0, lines:[], ledger:l, r:null};
  const last=DB.sess[DB.sess.length-1];
  const wk=weekKey(today());
  const r=xpForSession({w:pick,sets:sets}, l.best, last?daysAgo(last.d):null, (l.weeks[wk]||0)+1, l.paid);
  return {base:l.total, live:r.total, lines:r.lines, ledger:l, r:r};

/* A set is a record if it beats every earlier session and everything already
   logged today. Weighted lifts are judged set by set; bodyweight lifts are judged
   on the session total, so the flag lands on the set that breaks the old total. */
function isRecord(id,ix){
  const d=draft[id] && draft[id][ix];
  if(!d || !d.tk || !(+d.reps>0)) return false;
  const best=ledger().best[id];
  if(!best) return false;                       // first time out is a baseline
  if(EX[id].bw){
    let upto=0, before=0;
    draft[id].forEach((c,i)=>{
      if(!c.tk || !(+c.reps>0) || i>ix) return;
      upto+=+c.reps; if(i<ix) before+=+c.reps;
    });
    return upto>best.tot && before<=best.tot;
  }
  const earlier=draft[id].filter((c,i)=>i<ix && c.tk && +c.reps>0)
    .map(c=>({kg:+c.kg||0,reps:+c.reps}));
  const bar=mergeBest(id,best,setsPeak(id,earlier));
  return beatsBest(id,setsPeak(id,[{kg:+d.kg||0,reps:+d.reps}]),bar);
}

/* ---------- set order ---------- */
function seq(){
  const out=[], used={};
  if(!pick || !W[pick]) return out;      // called between a save and the next render
  W[pick].ex.forEach(id=>{
    if(used[id]) return;
    const g=pairOf(id)||[id];
    g.forEach(x=>{used[x]=1});
    const m=Math.max.apply(null,g.map(x=>setsFor(x)));
    for(let i=0;i<m;i++) g.forEach(x=>{ if(i<setsFor(x)) out.push(x+'-'+i); });
  });
  return out;
}
function nextKey(){
  return seq().find(k=>{
    const p=k.lastIndexOf('-'), id=k.slice(0,p), i=+k.slice(p+1);
    const c=draft[id] && draft[id][i];
    return !(c && c.tk);
  }) || null;
}
let saving=false;
/* Every set logged means the workout is over — bank it without another tap.
   The Save button stays for the nights you stop early; a short session still counts. */
function autoSaveIfDone(){
  if(saving || pick===null || !DB.sess) return;
  if(nextKey()) return;                       // still sets outstanding
  let any=false;
  for(const id in draft) if(draft[id].some(x=>+x.reps>0)) any=true;
  if(!any) return;
  saving=true;
  setTimeout(()=>{ saveSession(); saving=false; }, 700);
}
function setsDone(){
  return seq().filter(k=>{
    const q=k.lastIndexOf('-'), c=draft[k.slice(0,q)], cell=c && c[+k.slice(q+1)];
    return cell && cell.tk;
  }).length;
}

  const t=document.getElementById('stripSets'), g=document.getElementById('stripSeg');
  if(g && g.children.length!==total) g.innerHTML=Array(total+1).join('<b></b>');
  if(t) t.textContent = done ? done+' / '+total+' CLEARED' : total+' OBJECTIVES';
  if(g) [...g.children].forEach((b,i)=>b.className = i<done ? 'on' : '');
}
function updateNext(scroll){
  updateStrip();
  const k=nextKey();
  document.querySelectorAll('.upnext').forEach(u=>u.classList.add('hide'));
  document.querySelectorAll('.card.up').forEach(c=>c.classList.remove('up'));
  document.querySelectorAll('.setbtn.now').forEach(b=>b.classList.remove('now'));
  document.querySelectorAll('.setbtn.mate').forEach(b=>b.classList.remove('mate'));
  document.querySelectorAll('.chain.live').forEach(c=>c.classList.remove('live'));
  document.querySelectorAll('.setbtn.on').forEach(b=>b.classList.remove('now','arming'));
  document.documentElement.classList.toggle('session', !!T.start);
  if(!T.start) return;                     // nothing is "current" before the session starts
  if(k){ const b=document.getElementById('sb-'+k); if(b) b.classList.add('now'); }
  for(const id in draft){
    const card=document.getElementById('cd-'+id);
    if(card) card.classList.toggle('cdone', draft[id].every(x=>x.tk));
  }
  document.querySelectorAll('.chain').forEach(c=>{
    const cards=[...c.querySelectorAll('.card')];
    c.classList.toggle('cdone', cards.length>0 && cards.every(x=>x.classList.contains('cdone')));
  });
  if(!k){ document.documentElement.classList.remove('session'); autoSaveIfDone(); return; }
  const kid=k.slice(0,k.lastIndexOf('-')), kix=+k.slice(k.lastIndexOf('-')+1);
  const card=document.getElementById('cd-'+kid);
  if(card) card.classList.add('up');
  /* The other lifts in the chain at this same round are what comes next after this
     set — mark them so the round reads as one thing on the screen. */
  const g=pairOf(kid);
  if(g && g.length>1){
    const frame=document.getElementById('ch-'+g[0]); if(frame) frame.classList.add('live');
    g.forEach(x=>{
      if(x===kid || kix>=setsFor(x)) return;
      const cell=draft[x] && draft[x][kix];
      if(cell && cell.tk) return;
      const b=document.getElementById('sb-'+x+'-'+kix); if(b) b.classList.add('mate');
    });
  }

  const tag=document.getElementById('un-'+k.slice(0,k.lastIndexOf('-'))); if(tag) tag.classList.remove('hide');
  const row=document.getElementById('sb-'+k);
  if(scroll && row){
    scrollToNext();
    row.classList.add('flash');
    setTimeout(()=>row.classList.remove('flash'),900);
  }
}
/* The next set is often behind you — the chain sends you back up to the squat after
   the curl — so never assume it is further down the page. Work out where it actually
   is and put it in the band between the top of the screen and the fixed bar, showing
   the card heading with it when the whole card fits. */
/* Hand-rolled so the pace is ours: the browser's own smooth scroll is fast and
   varies by device. Eases in and out, and any touch cancels it. */
let SCROLLA=0;
function glideTo(y,ms){
  const max=Math.max(0,document.documentElement.scrollHeight-viewH());
  y=Math.min(max,Math.max(0,y));
  const from=window.pageYOffset, d=y-from;
  if(Math.abs(d)<2) return;
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ window.scrollTo(0,y); return; }
  /* Date.now throughout: the timestamp rAF hands back has a different origin. */
  const id=++SCROLLA, t0=Date.now(), dur=ms||700;
  const ease=t=>t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
  const step=()=>{
    if(id!==SCROLLA) return;
    const p=Math.min(1,(Date.now()-t0)/dur);
    window.scrollTo(0, from+d*ease(p));
    if(p<1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
window.addEventListener('touchstart',()=>{ SCROLLA++; },{passive:true});
let SCROLLFIX=0;
function scrollToNext(){
  const k=nextKey(); if(!k) return;
  const row=document.getElementById('sb-'+k); if(!row) return;
  syncPad();
  /* Centre the next set in the space above the bar, wherever it is. */
  const fh=fabH(), top=window.pageYOffset, vh=viewH(), band=vh-fh;
  const rowTop=row.getBoundingClientRect().top+top;
  const want=rowTop-(band-row.offsetHeight)/2;
  if(Math.abs(want-top)>24) glideTo(want,760);
  /* Smooth scrolling can be cut short, the toolbar can slide back in, and the bar
     can grow a line mid-session. Check once the movement has settled and nudge. */
  clearTimeout(SCROLLFIX);
  SCROLLFIX=setTimeout(()=>{
    if(nextKey()!==k || document.querySelector('.sheet')) return;
    const r=row.getBoundingClientRect(), floor=viewH()-fabH()-12;
    if(r.bottom>floor+2) glideTo(window.pageYOffset+(r.bottom-floor+8),320);
    else if(r.top<6) glideTo(window.pageYOffset+(r.top-16),320);
  },900);
}

function rTrain(){
  const n=nextWorkout(); if(pick===null)pick=n;

  document.getElementById('hdrK').textContent='OP '+String(sn+1).padStart(3,'0');

  /* Render block by block rather than exercise by exercise: a chain is one frame. */
  const blocks=[], seenEx={};
  W[pick].ex.forEach(id=>{

      '<div class="tgt'+(p.up?' up':'')+'">'+
        '<span class="tv">'+(e.bw?(e.lo+'\u2013'+e.hi+' reps')
          :(p.kg||'\u2014')+'kg \u00d7 '+e.lo+'\u2013'+e.hi)+'</span>'+
        (p.up?'<span class="tup">\u25b2 UP</span>':'')+
      '</div>'+
      (function(){

          (same?'<span class="pw">'+kgTxt(ls[0].kg)+'kg</span>':'')+

        ? (e.bw ? (d.v&&d.v!=='Bodyweight' ? esc(d.v)+' \u00b7 ' : '')+d.reps+' reps'
                : kgTxt(+d.kg)+'kg \u00d7 '+d.reps)

      h+='<button class="setbtn'+(on?' on':'')+(d.pending&&!on?' arming':'')+(T.start?'':' locked')+
         '" id="sb-'+id+'-'+s+'" data-x="'+id+'" data-s="'+s+'">'+

    }
    h+='<div class="brief"><button class="bsum" type="button" data-br="'+id+'">BRIEFING</button>'+
      '<div class="bbody" id="br-'+id+'"><div class="binner">'+
        '<div class="mus"><b>'+e.mus+'</b><i>'+e.sec+'</i></div>'+
        '<p>'+ns+' sets of '+e.lo+'\u2013'+e.hi+(e.side?' per side':'')+
          (chained?' \u00b7 superset with '+g.filter(x=>x!==id).map(x=>EX[x].n.toLowerCase()).join(' and '):'')+'</p>'+
        '<p><b>'+p.why+'</b></p>'+
      (capWarn(id,p.kg)?'<p class="capwarn">'+esc(capWarn(id,p.kg))+'</p>':'')+
        '<p>'+e.how+'</p><p><b>'+e.cue+'</b></p>'+

      (chained && gi<g.length-1
        ? '<div class="ssjoin"><svg viewBox="0 0 20 34" aria-hidden="true">'+
            '<rect x="5.5" y="4" width="9" height="16" rx="4.5"/>'+
            '<rect x="5.5" y="14" width="9" height="16" rx="4.5"/>'+
          '</svg></div>'
        : '');
    });

  h+='<button class="btn ghost" id="saveS">COMPLETE</button>';
  document.getElementById('v-train').innerHTML=h;

  const sw=document.getElementById('swapW');

    pick = pick==='A' ? 'B' : 'A'; draft={}; rTrain();
  };
  /* Commit whatever the two dropdowns currently show. They are pre-set to the
     previous weight and the top of the rep range, so the common case is one tap. */
  const st=document.getElementById('startS');
  if(st) st.onclick=()=>{

  };
  document.querySelectorAll('.setbtn').forEach(b=>b.onclick=()=>{
    if(!T.start){ toast('START THE SESSION FIRST'); return; }

}
function saveSession(){

/* ---------- progress ----------
   The log measures inputs: sets, weights, reps. The goal is measured in waist and
   photographs. This is where the two meet — what the scale is doing against its
   guardrails, what the tape says, when the next photographs are due, whether each
   muscle is getting the weekly sets the programme claims, and whether the lifts are
   actually climbing. */

/* Sets are credited in full to what a lift is built for and at half to what it
   assists, which is the usual way of counting weekly volume. */
const VOL={
  gsq:{Quads:1,Glutes:1,Abs:.5}, spl:{Quads:1,Glutes:.5},
  ht:{Glutes:1}, bp:{Chest:1,Triceps:.5,Shoulders:.5},
  dip:{Chest:1,Triceps:1,Shoulders:.5}, ohp:{Shoulders:1,Triceps:.5},
  lr:{Shoulders:1}, row:{Back:1,Biceps:.5}, csr:{Back:1,Biceps:.5},
  pu:{Back:1,Biceps:.5}, cur:{Biceps:1}, tri:{Triceps:1}, hkr:{Abs:1}
};
const MUSCLES=['Chest','Back','Shoulders','Biceps','Triceps','Quads','Glutes','Abs'];
/* Sets a week, measured over however long the log actually covers. Dividing four
   weeks of sets by four when only three of them have been trained is what made the
   number read low. No targets sit beside it: the programme decides the volume, and
   a bar that is permanently short of a line is a reason to stop rather than start. */
function volume(days){
  const out={};
  MUSCLES.forEach(m=>out[m]=0);
  DB.sess.forEach(s=>{
    if(daysAgo(s.d)>=days) return;
    for(const id in s.sets){
      const v=VOL[id]; if(!v) continue;
      const n=s.sets[id].filter(x=>+x.reps>0).length;
      for(const m in v) out[m]+=n*v[m];
    }
  });
  return out;
}
function volWeek(){
  const out={}; MUSCLES.forEach(m=>out[m]=0);
  const first=DB.sess.find(x=>daysAgo(x.d)<28 && x.sets && Object.keys(x.sets).length);
  if(!first) return out;
  const wks=Math.max(1,(daysAgo(first.d)+1)/7);
  const v=volume(28);
  MUSCLES.forEach(m=>out[m]=Math.round(v[m]/wks*10)/10);
  return out;
}
/* Weight guardrails, straight from the plan: flat is right, a kilo down in a month
   means eating too little, a kilo up means eating slightly too much. Each figure is
   its own line — a 14-day average and a month-on-month move are two different sums
   and reading them as one sentence hides both. */
function wtAvg(from,to){
  const v=DB.wt.filter(x=>{ const a=daysAgo(x.d); return a>=from && a<to; }).map(x=>+x.kg);
  return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null;
}
function shortDate(iso){
  const p=(iso||'').split('-');
  return p.length===3 ? (+p[2])+' '+MONTHS[+p[1]-1].slice(0,3) : (iso||'');
}
function wtVerdict(){
  const rows=[], last=DB.wt.length?DB.wt[DB.wt.length-1]:null;
  if(!last) return {rows:[['Logged','none']], bad:false};
  const now=wtAvg(0,14), then=wtAvg(28,42);
  if(now!==null) rows.push(['14-day average', now.toFixed(1)+'kg']);
  if(now!==null && then!==null){
    const d=now-then;
    rows.push(['Monthly change', (d>=0?'+':'')+d.toFixed(1)+'kg']);
    if(d<-1)     rows.push(['Trend','Falling \u00b7 eat more','warn']);
    else if(d>1) rows.push(['Trend','Climbing \u00b7 trim 100\u2013150 cal','warn']);
    else         rows.push(['Trend','Flat']);
    rows.push(['Last weigh-in', shortDate(last.d)]);
    return {rows:rows, bad:Math.abs(d)>1};
  }
  rows.push(['Last weigh-in', shortDate(last.d)]);
  return {rows:rows, bad:false};
}
function waistLine(){
  const w=DB.waist.slice().sort((a,b)=>a.d<b.d?1:-1);
  if(!w.length) return {rows:[['Logged','none']]};
  const last=w[0], first=w[w.length-1];
  const rows=[['Latest', last.cm+' \u00b7 '+shortDate(last.d)]];
  if(w.length>1){
    const d=(+last.cm)-(+first.cm);
    rows.push(['Since '+shortDate(first.d), (d>0?'+':'')+(Math.round(d*10)/10)]);
  }
  return {rows:rows};
}
const PHOTO_EVERY=28;
function photoDue(){
  if(!DB.photos.length) return {due:0, rows:[['Logged','none']]};
  const last=DB.photos.slice().sort((a,b)=>a.d<b.d?1:-1)[0];
  const left=PHOTO_EVERY-daysAgo(last.d);
  return {due:left, rows:[
    ['Last', shortDate(last.d)],
    ['Next', left<=0 ? 'due now' : 'in '+left+' day'+(left===1?'':'s'), left<=0?'warn':'']
  ]};
}
/* A single bell caps at 40kg, so the lifts loaded with one need warning before the
   ceiling arrives rather than on the night it does. */
const BELL_CAP=40;
const CAPPED={gsq:1, ht:1};
function capWarn(id,kg){
  if(!CAPPED[id] || !kg) return '';
  const left=ladder(id).filter(x=>x>kg && x<=BELL_CAP).length;
  if(left>2) return '';
  return left<=0 ? 'At the top of a single bell. Time to change the exercise, or slow the tempo and pause the reps.'
                 : left+' increment'+(left===1?'':'s')+' left on a single bell. Start thinking about tempo, pauses or one leg at a time.';
}

/* A shared editor for a single number, used to correct a weigh-in, a waist
   measurement, or the weight and reps of a set logged days ago. */
function numSheet(o){
  setSheet('<div class="veil" id="veil"></div><div class="sheet"><h3>'+esc(o.title)+
    '<button class="shx back" id="nsBack" aria-label="Back">\u2039</button></h3>'+

    '<input class="bignum" id="nsA" type="number" inputmode="decimal" step="'+(o.stepA||'0.1')+'" '+
      'value="'+(o.a!==undefined?o.a:'')+'" placeholder="'+esc(o.phA||'')+'">'+
    (o.two?'<input class="bignum" id="nsB" type="number" inputmode="numeric" step="1" '+
      'value="'+(o.b!==undefined?o.b:'')+'" placeholder="'+esc(o.phB||'')+'">':'')+
    '<button class="btn" id="nsSave">[ SAVE ]</button>'+
    (o.onDel?'<button class="btn ghost" id="nsDel">[ REMOVE ]</button>':''), true);
  const box=topSheet();
  const back=()=>popSheet();                 // step back, leaving the panel beneath
  box.querySelector('.veil,#veil');
  const veil=document.querySelectorAll('#sheetWrap .veil');
  veil[veil.length-1].onclick=back;
  box.querySelector('#nsBack').onclick=back;
  const A=box.querySelector('#nsA'), B=box.querySelector('#nsB');
  setTimeout(()=>A.focus(),120);
  box.querySelector('#nsSave').onclick=()=>{
    const a=num(A.value,o.loA,o.hiA);
    const b=o.two?num(B.value,o.loB,o.hiB):null;
    if(a===null || (o.two && b===null)) return toast('THAT DOES NOT LOOK RIGHT');
    o.onSave(a,b);
  };
  if(o.onDel) box.querySelector('#nsDel').onclick=async()=>{
    const ok=await askConfirm('Remove this?','It cannot be undone.','Remove');
    if(!ok) return numSheet(o);

/* A month of readings as a line. The window is swiped through — drag right for
   older, left for newer — and any reading in view can be tapped to read it off.
   Kept in one place so panning and selecting only redraw the graph, never the sheet. */
let CH=null;
const CH_W=300, CH_H=110, CH_P=6;
function chWindow(){
  const pts=CH.rows.filter(x=>{ const t=daysAgo(x.d); return t>=CH.end && t<CH.end+CH.win; })
                   .map(x=>({d:x.d, t:daysAgo(x.d), v:+CH.val(x)}));
  return pts.sort((a,b)=>b.t-a.t);
}
function chMaxEnd(){
  if(!CH.rows.length) return 0;
  return Math.max(0, daysAgo(CH.rows[0].d)-CH.win+1);
}
function chPaint(){
  const box=document.getElementById('chBox'); if(!box) return;
  const pts=chWindow();
  const xOf=t=>CH_P+(1-(t-CH.end)/CH.win)*(CH_W-CH_P*2);
  let svg;
  if(!pts.length){
    svg='<div class="chempty">No readings in this window.</div>';
  } else {
    const vs=pts.map(p=>p.v);
    let lo=Math.min.apply(null,vs), hi=Math.max.apply(null,vs);
    const pad=((hi-lo)||1)*0.25; lo-=pad; hi+=pad;
    const avg=vs.reduce((a,b)=>a+b,0)/vs.length;
    const yOf=v=>CH_H-CH_P-((v-lo)/(hi-lo))*(CH_H-CH_P*2);
    const d=pts.map((p,i)=>(i?'L':'M')+xOf(p.t).toFixed(1)+' '+yOf(p.v).toFixed(1)).join(' ');
    const sel=pts.find(p=>p.d===CH.sel);
    const dots=pts.map(p=>'<circle'+(p.d===CH.sel?' class="sel" r="3.4"':' r="1.8"')+
      ' cx="'+xOf(p.t).toFixed(1)+'" cy="'+yOf(p.v).toFixed(1)+'"/>').join('');
    svg='<svg class="chart" viewBox="0 0 '+CH_W+' '+CH_H+'" preserveAspectRatio="none">'+
      '<line class="avg" x1="'+CH_P+'" y1="'+yOf(avg).toFixed(1)+'" x2="'+(CH_W-CH_P)+
        '" y2="'+yOf(avg).toFixed(1)+'"/>'+
      (sel?'<line class="pick" x1="'+xOf(sel.t).toFixed(1)+'" y1="'+CH_P+
        '" x2="'+xOf(sel.t).toFixed(1)+'" y2="'+(CH_H-CH_P)+'"/>':'')+
      (pts.length>1?'<path class="line" d="'+d+'"/>':'')+
      '<g class="dots">'+dots+'</g></svg>';
    const top=document.getElementById('chTop');
    if(top) top.innerHTML='<span>'+esc(shortDate(pts[0].d))+' \u2013 '+
      esc(shortDate(pts[pts.length-1].d))+'</span><span>avg '+
      (Math.round(avg*100)/100)+CH.unit+'</span>';
    const line=document.getElementById('chSel');
    const show=sel||pts[pts.length-1];   // nothing picked reads the latest in view
    if(line) line.innerHTML='<span>'+esc(shortDate(show.d))+'</span><b>'+
      (Math.round(show.v*100)/100)+CH.unit+'</b>';
  }
  box.innerHTML=svg;
  if(!pts.length){
    const top=document.getElementById('chTop'), line=document.getElementById('chSel');
    if(top) top.innerHTML='';
    if(line) line.innerHTML='';
  }
}
function chBind(){
  const box=document.getElementById('chBox'); if(!box) return;
  let sx=0, sy=0, end0=0, down=false, moved=false, horiz=false;
  box.addEventListener('pointerdown',e=>{
    down=true; moved=false; horiz=false; sx=e.clientX; sy=e.clientY; end0=CH.end;
  });
  box.addEventListener('pointermove',e=>{
    if(!down) return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(!horiz){
      if(Math.abs(dx)<6 && Math.abs(dy)<6) return;
      if(Math.abs(dx)<=Math.abs(dy)){ down=false; return; }   // that was a scroll
      horiz=true;
      try{ box.setPointerCapture(e.pointerId); }catch(err){}
    }
    moved=true;
    const perDay=(box.clientWidth||CH_W)/CH.win;
    CH.end=Math.max(0, Math.min(chMaxEnd(), Math.round(end0+dx/perDay)));
    chPaint();
  });
  const up=e=>{
    if(!down) return;
    down=false;
    if(moved) return;
    const pts=chWindow(); if(!pts.length) return;
    const r=box.getBoundingClientRect();
    const t=CH.end+(1-(e.clientX-r.left)/r.width)*CH.win;
    let best=pts[0];
    pts.forEach(p=>{ if(Math.abs(p.t-t)<Math.abs(best.t-t)) best=p; });
    CH.sel = CH.sel===best.d ? null : best.d;      // tapping the same point clears it
    sfx('tap');
    chPaint();
  };
  box.addEventListener('pointerup',up);
  box.addEventListener('pointercancel',()=>{ down=false; });
}

        onSave:(v)=>{ if(isW) a2[i].kg=v; else a2[i].cm=v; save(); toast('UPDATED'); again(); },

/* ---------- session history ----------
   Every session in the log, newest first: what was done, at what weight, for how
   many reps. One session open at a time so the list stays scannable. */
const MONTHS=['January','February','March','April','May','June','July',
              'August','September','October','November','December'];
function ord(n){ const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function longDate(iso){
  const p=(iso||'').split('-');
  return p.length===3 ? ord(+p[2])+' '+MONTHS[+p[1]-1]+' '+p[0].slice(2) : (iso||'');
}
/* One row per lift on a grid, so the weight and each set sit in the same column all
   the way down the session however long the lift's name is. */
/* Corrections. A set logged wrong days ago can be fixed or removed here, and a
   session that should never have been saved can go entirely. */
function editSet(si,id,ix){
  const s=DB.sess[si], e=EX[id], row=s.sets[id][ix];
  numSheet({
    title:e.n, note:longDate(s.d)+' \u00b7 set '+(ix+1)+(e.bw?' \u00b7 reps only':''),
    two:!e.bw, a:e.bw?row.reps:row.kg, b:e.bw?undefined:row.reps,
    stepA:e.bw?'1':'0.5', phA:e.bw?'reps':'kg', phB:'reps',
    loA:e.bw?1:0.5, hiA:e.bw?200:200, loB:1, hiB:200,
    back:openHistory,
    onSave:(a,b)=>{
      if(e.bw) row.reps=Math.round(a);
      else { row.kg=a; row.reps=Math.round(b); }
      save(); toast('UPDATED'); openHistory();
    },
    onDel:()=>{
      s.sets[id].splice(ix,1);
      if(!s.sets[id].length) delete s.sets[id];
      save(); toast('SET REMOVED'); openHistory();
    }});
}
async function delSession(si){
  const s=DB.sess[si];
  const ok=await askConfirm('Delete this session?',
    longDate(s.d)+' and everything logged in it. It cannot be undone.','Delete');
  if(!ok) return openHistory();
  DB.sess.splice(si,1); save(); toast('SESSION DELETED'); rTrain(); openHistory();
}
function histSets(id,v,si){
  const e=EX[id]||{n:id};
  const done=(v||[]).filter(x=>+x.reps>0);
  if(!done.length) return '';
  const bw=e.bw, kgs=done.map(x=>+x.kg||0);
  const same=!bw && kgs.every(k=>k===kgs[0]);
  let cells='';
  for(let i=0;i<3;i++){
    const x=done[i];
    cells += x ? '<button class="pc" data-fix="'+si+':'+id+':'+(v.indexOf(x))+'">'+
                   ((!bw&&!same)?kgTxt(+x.kg||0)+'\u00d7':'')+x.reps+'</button>'
               : '<span class="pc blank"></span>';
  }
  return '<div class="hex"><span class="hn">'+esc(e.n||id)+'</span>'+
    '<span class="pw">'+(same?kgTxt(kgs[0])+'kg':'')+'</span>'+cells+'</div>';
}
function histOpen(i){
  const box=document.querySelector('.hhead[data-h="'+i+'"]');
  if(!box) return;
  const sess=box.parentNode, body=document.getElementById('hb-'+i);
  const sheet=sess.closest('.sheet');
  const was=sess.classList.contains('open');
  const mark=sess.getBoundingClientRect().top;
  document.querySelectorAll('.hsess.open').forEach(o=>{
    if(o===sess) return;
    const b=o.querySelector('.hbody');
    b.classList.remove('anim'); b.style.height='0px';     // shut instantly
    o.classList.remove('open');
  });
  /* whatever closed above us has moved this row; put it back under the finger */
  const moved=sess.getBoundingClientRect().top-mark;
  if(sheet && Math.abs(moved)>1) sheet.scrollTop+=moved;
  if(was){
    body.classList.add('anim');
    body.style.height=body.scrollHeight+'px';
    requestAnimationFrame(()=>{ body.style.height='0px'; });
    sess.classList.remove('open');
    return;
  }
  sess.classList.add('open');
  const mon=sess.closest('.hmbody');
  if(mon && mon.style.height && mon.style.height!=='auto') mon.style.height='auto';
  body.classList.add('anim');
  body.style.height='0px';
  requestAnimationFrame(()=>{ body.style.height=body.scrollHeight+'px'; });
  const done=e=>{
    if(e.propertyName!=='height') return;
    body.removeEventListener('transitionend',done);
    if(sess.classList.contains('open')) body.style.height='auto';
  };
  body.addEventListener('transitionend',done);
}
